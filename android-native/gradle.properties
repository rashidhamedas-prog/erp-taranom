org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# محصول بومی: AndroidX اجباری است.
# پروژهٔ legacy (`android/`) هنوز android.useAndroidX=false دارد — آن فایل لمس نمی‌شود.
android.useAndroidX=true
android.nonTransitiveRClass=true

# compileSdk 36 با AGP 8.7.x رسمی اعلام نشده؛ مبنای شواهد legacy حفظ می‌شود
# (docs/architecture/NATIVE-ANDROID-EVIDENCE.md §A). با ارتقای AGP این خط حذف شود.
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
