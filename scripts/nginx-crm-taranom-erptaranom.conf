# ERP ترنم — dual-host cutover (safe phase)
# - erp.poshaktaranom.com keeps serving (Cloudflare Origin CA) until erptaranom.com has LE cert
# - erptaranom.com HTTP ready for ACME + app proxy

# HTTP: old + new + ACME
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name erptaranom.com www.erptaranom.com erp.poshaktaranom.com _;

  client_max_body_size 20m;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS: current production host (Cloudflare Origin CA)
server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name erp.poshaktaranom.com;

  ssl_certificate     /etc/ssl/taranom/erp.poshaktaranom.com.crt;
  ssl_certificate_key /etc/ssl/taranom/erp.poshaktaranom.com.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_prefer_server_ciphers off;

  client_max_body_size 20m;

  add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_next_upstream off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}

# HTTPS placeholder for new domain uses temporary self-signed until certbot
# Certbot --nginx will replace/extend this block after DNS A → 94.249.244.208
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name erptaranom.com www.erptaranom.com;

  ssl_certificate     /etc/ssl/taranom/erptaranom.com.crt;
  ssl_certificate_key /etc/ssl/taranom/erptaranom.com.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_prefer_server_ciphers off;

  client_max_body_size 20m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_next_upstream off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
