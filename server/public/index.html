<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CRM ترنم</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1A5C38">
<link rel="apple-touch-icon" href="/logo.png">
<!-- همه دارایی‌ها محلی هستند — هیچ وابستگی به CDN خارجی (Google Fonts / jsDelivr)
     تا زیر فیلترینگ/اینترنت داخلی هم برنامه فوری و کامل بارگذاری شود.
     اسکریپت‌ها defer دارند تا رندر صفحه را بلوکه نکنند. -->
<link href="/vendor/vazirmatn/vazirmatn.css" rel="stylesheet">
<script src="/vendor/chart.umd.js" defer></script>
<script src="/vendor/html2canvas.min.js" defer></script>
<style>
:root{
  --purple:#1A5C38; --purple2:#2E7D4F; --purple-light:#E8F5EE;
  --gold:#C9A227; --gold-light:#FBF5E1;
  --green:#059669; --red:#DC2626; --orange:#D97706; --blue:#2563EB;
  --bg:#f5f3ee; --card:#ffffff; --text:#22301f; --muted:#6b7280; --border:#e8e6df;
  --hero:linear-gradient(120deg,#1A5C38 0%,#2E7D4F 55%,#C9A227 135%);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Vazirmatn',sans-serif}
html,body{height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.7}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#a8c8b4;border-radius:8px}

/* ===== Login ===== */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--hero);padding:20px;z-index:1000}
.login-card{background:#fff;border-radius:20px;padding:38px 30px;width:100%;max-width:380px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center}
.login-card .logo{font-size:54px;margin-bottom:8px}
.login-card h1{color:var(--purple);font-size:24px;margin-bottom:4px}
.login-card p{color:var(--muted);font-size:13px;margin-bottom:24px}
.login-card .field{text-align:right;margin-bottom:14px}
.login-card label{display:block;font-size:13px;margin-bottom:6px;color:var(--muted)}
.login-card input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;outline:none}
.login-card input:focus{border-color:var(--purple2)}
.login-card button{width:100%;background:var(--purple);color:#fff;border:none;padding:13px;border-radius:10px;
  font-size:15px;font-weight:600;margin-top:8px}
.login-card button:hover{background:var(--purple2)}
.login-err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
.login-hint{margin-top:18px;font-size:11px;color:#9ca3af}

/* ===== Layout ===== */
#app{display:none}
.layout{display:flex;min-height:100vh}
.sidebar{width:240px;background:linear-gradient(180deg,var(--purple),var(--purple2));color:#fff;
  position:fixed;top:0;right:0;bottom:0;display:flex;flex-direction:column;z-index:50;
  transition:transform .25s cubic-bezier(.4,0,.2,1)}
.sidebar.collapsed{transform:translateX(110%)}
.main.expanded{margin-right:0!important}
.sidebar .brand{padding:22px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.15)}
.sidebar .brand .emoji{font-size:30px}
.sidebar .brand h2{font-size:18px}
.sidebar .brand small{font-size:11px;opacity:.8;display:block}
.nav{flex:1;overflow-y:auto;padding:12px 0}
.nav a{display:flex;align-items:center;gap:12px;padding:12px 22px;color:rgba(255,255,255,.85);font-size:14px;position:relative}
.nav a .ico{font-size:18px;width:24px;text-align:center}
.nav a:hover{background:rgba(255,255,255,.1);color:#fff}
.nav a.active{background:rgba(255,255,255,.18);color:#fff;font-weight:600}
.nav a.active::before{content:'';position:absolute;right:0;top:0;bottom:0;width:4px;background:var(--gold)}
.nav .badge{position:absolute;left:18px;background:var(--red);color:#fff;font-size:10px;
  min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.sidebar .foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.15);font-size:12px}
.sidebar .foot button{width:100%;background:rgba(255,255,255,.15);color:#fff;border:none;padding:9px;border-radius:8px;margin-top:8px}
.sidebar .foot button:hover{background:rgba(255,255,255,.28)}

.main{flex:1;margin-right:240px;display:flex;flex-direction:column;min-height:100vh;min-width:0}
.topbar{background:var(--hero);border-bottom:none;padding:14px 24px;display:flex;color:#fff;
  align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;
  box-shadow:0 4px 18px rgba(26,92,56,.22)}
.topbar .left{display:flex;align-items:center;gap:14px}
.topbar .menu-btn{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.16);color:#fff;border:none;
  width:38px;height:38px;border-radius:10px;font-size:20px}
.topbar h3{font-size:17px;color:#fff;font-weight:800}
.topbar .right{display:flex;align-items:center;gap:16px}
.topbar .clock{font-size:13px;color:#fff;background:rgba(255,255,255,.16);padding:6px 12px;border-radius:99px;font-weight:600}
.topbar .user{display:flex;align-items:center;gap:8px;font-size:13px}
.topbar .user .muted{color:rgba(255,255,255,.75)!important}
.topbar .avatar{width:36px;height:36px;border-radius:12px;background:var(--gold);color:#1A3A26;
  display:flex;align-items:center;justify-content:center;font-weight:800}
.content{padding:22px;flex:1}

/* ===== Cards / Generic ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:22px;width:100%}
.stat{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(26,92,56,.08);
  border:none;border-bottom:4px solid var(--purple);display:flex;align-items:center;gap:14px;min-width:0;overflow:hidden}
.stat:has(.ic.g){border-bottom-color:var(--green)}
.stat:has(.ic.o){border-bottom-color:var(--gold)}
.stat:has(.ic.r){border-bottom-color:var(--red)}
.stat:has(.ic.b){border-bottom-color:var(--blue)}
.stat .ic{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.stat .v{font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden}
.stat .l{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat > div:last-child{min-width:0;overflow:hidden}
.ic.p{background:var(--purple-light);color:var(--purple)}
.ic.g{background:#d1fae5;color:var(--green)}
.ic.r{background:#fee2e2;color:var(--red)}
.ic.o{background:#fef3c7;color:var(--orange)}
.ic.b{background:#dbeafe;color:var(--blue)}

.panel{background:var(--card);border-radius:18px;border:1px solid var(--border);
  box-shadow:0 2px 10px rgba(34,48,31,.05);margin-bottom:20px;overflow:hidden}
.panel-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;
  align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.panel-head h4{font-size:15px;color:var(--purple)}
.panel-body{padding:18px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input,.toolbar select{padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;outline:none;background:#fff}
.toolbar input:focus,.toolbar select:focus{border-color:var(--purple2)}
.search{flex:1;min-width:180px}

.btn{background:var(--purple);color:#fff;border:none;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--purple2)}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.blue{background:var(--blue)}.btn.orange{background:var(--orange)}
.btn.ghost{background:#fff;color:var(--purple);border:1.5px solid var(--purple)}
.btn.ghost:hover{background:var(--purple-light)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.icon{padding:6px 9px}

/* ===== Table ===== */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
table.tbl th{background:#F2F7F3;color:var(--purple);text-align:right;padding:11px 12px;font-weight:700;border-bottom:2px solid var(--border);white-space:nowrap}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
table.tbl tr:hover td{background:#F7FAF7}
.empty{text-align:center;color:var(--muted);padding:36px 10px}

.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.t-vip{background:#fef3c7;color:#92400e}.t-active{background:#d1fae5;color:#065f46}
.t-followup{background:#dbeafe;color:#1e40af}.t-silent{background:#fee2e2;color:#991b1b}
.t-new{background:var(--purple-light);color:var(--purple)}
.t-pending{background:#fef3c7;color:#92400e}.t-onway{background:#dbeafe;color:#1e40af}
.t-done{background:#d1fae5;color:#065f46}.t-cancel{background:#fee2e2;color:#991b1b}
.t-open{background:#dbeafe;color:#1e40af}
.t-high{background:#fee2e2;color:#991b1b}.t-mid{background:#fef3c7;color:#92400e}.t-low{background:#d1fae5;color:#065f46}
.t-proforma{background:var(--purple-light);color:var(--purple)}.t-final{background:#d1fae5;color:#065f46}

/* ===== Modal ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;
  justify-content:center;z-index:200;padding:16px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.lg{max-width:820px}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:2}
.modal-head h3{font-size:17px;color:var(--purple)}
.modal-head .x{background:#f3f4f6;border:none;width:32px;height:32px;border-radius:8px;font-size:18px;color:var(--muted)}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-start;position:sticky;bottom:0;background:#fff}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg{display:flex;flex-direction:column;gap:6px}
.fg.full{grid-column:1/-1}
.fg label{font-size:13px;color:var(--muted)}
.fg input,.fg select,.fg textarea{padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;outline:none;background:#fff}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--purple2)}
.fg textarea{resize:vertical;min-height:70px}
.fg input[readonly]{background:#f3f4f6;color:var(--muted)}

/* ===== Jalali datepicker (minimal) ===== */
.dp-overlay{position:fixed;inset:0;z-index:599;display:none}
.dp-overlay.open{display:block}
.dp{position:fixed;background:#fff;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.16);border:1px solid var(--border);width:224px;z-index:600;display:none;padding:10px}
.dp.open{display:block;animation:dpPop .12s ease}
@keyframes dpPop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
/* Nav row */
.dp-nav{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.dp-nav button{background:none;color:var(--text);border:1px solid var(--border);width:24px;height:24px;border-radius:5px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.1s;flex-shrink:0;padding:0}
.dp-nav button:hover{background:var(--purple-light);border-color:var(--purple);color:var(--purple)}
.dp-nav select{flex:1;background:#fff;color:var(--text);border:1px solid var(--border);border-radius:5px;padding:2px 4px;font-size:11px;font-family:inherit;cursor:pointer;outline:none;direction:rtl;text-align:center;height:24px}
.dp-nav .dp-month-lbl{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--text)}
/* Weekday headers */
.dp-week{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:3px}
.dp-week span{text-align:center;font-size:9px;font-weight:700;color:var(--muted);padding:2px 0}
/* Day squares */
.dp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-days button{width:100%;aspect-ratio:1;border:1px solid transparent;background:transparent;border-radius:4px;font-size:11px;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .08s,color .08s;position:relative;font-family:inherit;padding:0}
.dp-days button:hover:not(.empty):not(.sel){background:var(--purple-light);color:var(--purple);border-color:var(--purple)}
.dp-days button.today{font-weight:800;color:var(--purple);border-color:var(--purple)}
.dp-days button.sel{background:var(--purple)!important;color:#fff!important;font-weight:700;border-color:var(--purple)!important}
.dp-days button.empty{visibility:hidden;cursor:default;pointer-events:none}
/* Footer */
.dp-foot{display:flex;gap:5px;margin-top:8px;padding-top:7px;border-top:1px solid var(--border)}
.dp-foot button{flex:1;font-size:11px;padding:4px 0;border:1px solid var(--border);border-radius:5px;cursor:pointer;font-family:inherit;font-weight:600;background:#fff;color:var(--text);transition:.1s}
.dp-foot .today-btn:hover{background:var(--purple);color:#fff;border-color:var(--purple)}
.dp-foot .clear-btn:hover{background:#f3f4f6}
@media(max-width:480px){
  .dp{width:calc(100vw - 24px);left:12px!important;right:12px!important;bottom:12px!important;top:auto!important;border-radius:10px;animation:dpSlideUp .15s ease}
  @keyframes dpSlideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .dp-days button{font-size:13px}
}

/* ===== Product grid ===== */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.pcard{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05);transition:.15s;position:relative}
.pcard:hover{box-shadow:0 6px 18px rgba(107,33,168,.15);transform:translateY(-2px)}
.pcard .img{aspect-ratio:1;background:var(--purple-light);display:flex;align-items:center;justify-content:center;font-size:42px;overflow:hidden}
.pcard .img img{width:100%;height:100%;object-fit:cover;object-position:center}
.pcard .body{padding:12px}
.pcard .name{font-weight:600;font-size:14px;margin-bottom:4px}
.pcard .code{font-size:11px;color:var(--muted);margin-bottom:8px}
.pcard .price{color:var(--green);font-weight:700;font-size:15px}
.pcard .stock{font-size:12px;margin-top:6px}
.pcard .stock.low{color:var(--red);font-weight:600}
.pcard .acts{display:flex;gap:6px;margin-top:10px}
.pcard .acts button{flex:1;font-size:12px;padding:6px;border:none;border-radius:7px}

/* ===== Invoice builder ===== */
.inv-layout{display:grid;grid-template-columns:1fr 380px;gap:18px}
.inv-products{max-height:560px;overflow-y:auto}
.inv-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pick-card{border:1px solid var(--border);border-radius:10px;padding:8px;cursor:pointer;text-align:center;background:#fff}
.pick-card:hover{border-color:var(--purple2);background:var(--purple-light)}
.pick-card .pimg{aspect-ratio:1;background:var(--purple-light);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;margin-bottom:6px}
.pick-card .pimg img{width:100%;height:100%;object-fit:cover;object-position:center}
.pick-card .pn{font-size:12px;font-weight:600;min-height:32px}
.pick-card .pp{font-size:12px;color:var(--green);font-weight:700}
.inv-cart{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;position:sticky;top:80px;align-self:start}
.cart-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px}
.cart-row .cn{flex:1}
.cart-row input{width:54px;padding:5px;text-align:center;border:1px solid var(--border);border-radius:6px}
.cart-row .price-in{width:84px}
.cart-row .rm{background:#fee2e2;color:var(--red);border:none;width:26px;height:26px;border-radius:6px}
.cart-tot{margin-top:12px;font-size:13px}
.cart-tot .l{display:flex;justify-content:space-between;padding:5px 0}
.cart-tot .final{font-weight:800;font-size:16px;color:var(--green);border-top:1px solid var(--border);padding-top:8px;margin-top:4px}

/* ===== Messages ===== */
.msg-tabs{display:flex;gap:8px;margin-bottom:14px}
.msg-tabs button{padding:8px 16px;border:none;border-radius:9px;background:#f3f4f6;color:var(--muted);font-weight:600}
.msg-tabs button.active{background:var(--purple);color:#fff}
.msg{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.msg.unread{border-right:4px solid var(--purple);background:#faf8ff}
.msg .mh{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.msg .mb{font-size:14px}

/* ===== Toast ===== */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:900;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#1f2937;color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:slideup .25s}
.toast.success{background:var(--green)}.toast.error{background:var(--red)}.toast.info{background:var(--blue)}
@keyframes slideup{from{opacity:0;transform:translateY(20px)}to{opacity:1}}

.muted{color:var(--muted)}
.right{text-align:right}.center{text-align:center}.left{text-align:left}
.mono{font-variant-numeric:tabular-nums}
.flex{display:flex}.gap{gap:10px}.wrap{flex-wrap:wrap}
.hide{display:none!important}

/* ===== Searchable Customer Select ===== */
.cust-sw{position:relative}
.cust-si{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;outline:none;background:#fff;font-family:inherit;font-size:14px;color:var(--text)}
.cust-si:focus{border-color:var(--purple2);box-shadow:0 0 0 3px rgba(35,107,68,.08)}
.cust-si-drop{background:#fff;border:1.5px solid var(--border);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.16);overflow-y:auto;z-index:2000;direction:rtl}
.cust-si-item{padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px}
.cust-si-item:last-child{border-bottom:none}
.cust-si-item:hover{background:var(--purple-light);color:var(--purple)}
.cust-si-meta{font-size:11px;color:var(--muted);white-space:nowrap}
.cust-si-empty{padding:14px;text-align:center;color:var(--muted);font-size:12px}

/* ===== Contextual help tooltip ===== */
.hlp{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--purple-light);color:var(--purple);font-size:9px;font-weight:800;cursor:help;margin-right:4px;vertical-align:middle;position:relative;user-select:none;flex-shrink:0;line-height:1}
.hlp::before{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);right:-8px;background:#1e293b;color:#f1f5f9;padding:9px 13px;border-radius:11px;font-size:12px;width:240px;white-space:normal;line-height:1.65;z-index:10000;display:none;text-align:right;direction:rtl;font-weight:400;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none}
.hlp::after{content:'';position:absolute;bottom:calc(100% + 3px);right:4px;border:5px solid transparent;border-top-color:#1e293b;display:none;pointer-events:none}
.hlp:hover::before,.hlp:hover::after{display:block}
/* Mobile: pin the tooltip to the bottom of the viewport so it can never overflow the screen */
@media(max-width:600px){
  .hlp::before{position:fixed;left:12px;right:12px;bottom:14px;top:auto;width:auto;max-width:none;box-shadow:0 -4px 24px rgba(0,0,0,.35)}
  .hlp::after{display:none!important}
  .hlp:hover::after,.hlp:active::after{display:none!important}
}

/* ===== Help Page ===== */
.help-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.help-tabs button{padding:9px 18px;border:none;border-radius:10px;background:#f3f4f6;color:var(--muted);font-weight:600;cursor:pointer;font-family:inherit;font-size:14px}
.help-tabs button.active{background:var(--purple);color:#fff}
.help-section{background:#fff;border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden}
.help-section .hs-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;font-weight:700;font-size:15px;user-select:none}

async function api(method, path, data, isFormData){
  const opts = { method, headers:{} };
  const token = localStorage.getItem('crm_token');
  if(token) opts.headers['Authorization'] = 'Bearer ' + token;
  if(data && !isFormData){ opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(data); }
  else if(isFormData) opts.body = data;
  let r;
  try { r = await fetch('/api'+path, opts); }
  catch(e){ showToast('خطای ارتباط با سرور','error'); throw e; }
  if(r.status === 401){ logout(); return null; }
  const ct = r.headers.get('content-type')||'';
  if(ct.includes('application/json')){
    const j = await r.json();
    if(!r.ok){ showToast(j.error || 'خطا رخ داد','error'); throw new Error(j.error||'error'); }
    return j;
  }
  if(!r.ok){ showToast('خطا رخ داد','error'); throw new Error('error'); }
  return r;
}

/* ============================================================
   UTILITIES
============================================================ */
function fmt(n){ return Number(n||0).toLocaleString('fa-IR'); }

/* ---- Money inputs: live thousand-separator formatting (spec item 1) ----
   Amount fields use class="money" (type=text inputmode=numeric). A single
   delegated listener formats them as the user types (1000000 → 1,000,000),
   and moneyVal(id) reads back the raw integer. Applied globally to every
   monetary input across the app; quantity/percent/hour fields stay plain. */
function formatMoneyInput(elm){
  const digits=(elm.value||'').replace(/[^\d]/g,'');
  const fromEnd=(elm.value||'').length-(elm.selectionStart||0);
  elm.value = digits ? Number(digits).toLocaleString('en-US') : '';
  const pos=Math.max(0, elm.value.length-fromEnd);
  try{ elm.setSelectionRange(pos,pos); }catch(e){}
}
function moneyVal(id){ const e=el(id); if(!e) return 0; return parseInt((e.value||'').replace(/[^\d]/g,''))||0; }
// Pre-fill a money input with a formatted initial value
function moneyInit(v){ v=parseInt(v)||0; return v?Number(v).toLocaleString('en-US'):''; }
document.addEventListener('input', function(e){
  const t=e.target;
  if(t && t.classList && t.classList.contains('money')) formatMoneyInput(t);
}, true);
function toFa(n){ return String(n||0).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escDate(s){ // validate and display Jalali date; if corrupted, show '-'
  if(!s) return '-';
  const str=String(s);
  if(/^\d{4}\/\d{2}\/\d{2}$/.test(str)) return esc(str);
  return '<span class="muted" title="تاریخ نادرست">—</span>';
}
function el(id){ return document.getElementById(id); }

function showToast(msg, type='success'){
  const t = document.createElement('div');
  t.className = 'toast '+type;
  t.textContent = msg;
  el('toasts').appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='.3s'; setTimeout(()=>t.remove(),300); }, 2800);
}

/* ============================================================
   JALALI DATE CONVERSION
============================================================ */
function _g2j(gy,gm,gd){
  var g2=[0,31,59,90,120,151,181,212,243,273,304,334];
  var gy2=(gm>2)?(gy+1):gy;
  var days=355666+(365*gy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd+g2[gm-1];
  var jy=-1595+(33*Math.floor(days/12053));
  days%=12053; jy+=4*Math.floor(days/1461); days%=1461;
  if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365;}
  var jm,jd;
  if(days<186){jm=1+Math.floor(days/31);jd=1+(days%31);}
  else{jm=7+Math.floor((days-186)/30);jd=1+((days-186)%30);}
  return[jy,jm,jd];
}
function _jIsLeap(y){return((((y-474)%2820)+474+38)*682)%2816<682;}
function _jDIM(m,y){return m<=6?31:m<=11?30:_jIsLeap(y)?30:29;}
function _j2g(jy,jm,jd){
  jy+=1595;
  var days=-355668+(365*jy)+(Math.floor(jy/33)*8)+Math.floor(((jy%33)+3)/4)+jd+((jm<7)?(jm-1)*31:((jm-7)*30+186));
  var gy=400*Math.floor(days/146097); days%=146097;
  if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++;}
  gy+=4*Math.floor(days/1461); days%=1461;
  if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365;}
  var gd=days+1;
  var sal=[0,31,((gy%4===0&&gy%100!==0)||(gy%400===0))?29:28,31,30,31,30,31,31,30,31,30,31];
  var gm;for(gm=0;gm<13&&gd>sal[gm];gm++)gd-=sal[gm];
  return[gy,gm,gd];
}
const J_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const J_WEEK = ['ش','ی','د','س','چ','پ','ج'];
let _srvOffset = 0; // ms offset between server clock and client clock
function _serverNow(){ return new Date(Date.now() + _srvOffset); }
function todayJalali(){
  const d=_serverNow();
  const ds=d.toLocaleDateString('en-CA',{timeZone:'Asia/Tehran'});
  const [gy,gm,gdd]=ds.split('-').map(Number);
  const [y,m,dd]=_g2j(gy,gm,gdd);
  return y+'/'+String(m).padStart(2,'0')+'/'+String(dd).padStart(2,'0');
}
async function syncServerTime(){
  try{
    const t0=Date.now();
    const r=await fetch('/api/system/time'); if(!r.ok) return;
    const j=await r.json(); const rtt=Date.now()-t0;
    if(j.ts) _srvOffset=(j.ts+rtt/2)-Date.now();
  }catch(e){}
}
const _jfmt=(y,m,d)=>y+'/'+String(m).padStart(2,'0')+'/'+String(d).padStart(2,'0');
// Preset Jalali date ranges: week (Saturday-start), month, lastMonth → [from, to]
function jPresetRange(preset){
  const today=todayJalali();
  const [jy,jm]=today.split('/').map(Number);
  if(preset==='week'){
    const ds=_serverNow().toLocaleDateString('en-CA',{timeZone:'Asia/Tehran'});
    const [gy,gm,gd]=ds.split('-').map(Number);
    const dow=new Date(gy,gm-1,gd).getDay();     // Sun=0 … Sat=6
    const sinceSat=(dow+1)%7;                    // days since Saturday (Iranian week start)
    const st=new Date(gy,gm-1,gd); st.setDate(st.getDate()-sinceSat);
    const [sy,sm,sd]=_g2j(st.getFullYear(),st.getMonth()+1,st.getDate());
    return [_jfmt(sy,sm,sd), today];
  }
  if(preset==='month') return [_jfmt(jy,jm,1), today];
  if(preset==='lastMonth'){
    const py=jm===1?jy-1:jy, pm=jm===1?12:jm-1;
    return [_jfmt(py,pm,1), _jfmt(py,pm,_jDIM(pm,py))];
  }
  return ['',''];
}
// Shared preset <select> for date toolbars; onPick(from,to,preset) fires on change
function presetSelect(id,current,handler){

}

function custSelect(id, selectedId, optional=false){
  const sel=selectedId?CACHE.customers.find(c=>c.id===+selectedId):null;
  const ph=optional?'مشتری مرتبط (اختیاری)...':'جستجو: نام، موبایل، کد...';

    <div id="${esc(id)}-drop" class="cust-si-drop" style="display:none;position:fixed;width:280px;max-height:220px"></div>

}
function initCustSearches(scope){
  (scope||document).querySelectorAll('.cust-sw').forEach(sw=>{
    const id=sw.dataset.csId;
    const kind=sw.dataset.kind||'customer';
    const inp=el(id+'-input');
    if(!inp||inp.dataset.csBound) return;
    inp.dataset.csBound='1';
    inp.addEventListener('focus',()=>kind==='supplier'?showSupplierDrop(id,''):showCustDrop(id,''));
    inp.addEventListener('input',()=>kind==='supplier'?showSupplierDrop(id,inp.value):showCustDrop(id,inp.value));
    inp.addEventListener('keydown',e=>{
      if(e.key==='Escape'){kind==='supplier'?hideSupplierDrop(id):hideCustDrop(id);}
    });
  });
}
// Supplier search initializer — alias so purchase/return modals can call either name
function initSupplierSearches(scope){ initCustSearches(scope); }
function supplierSelect(id, selectedId){
  const sel=selectedId?(CACHE.suppliers||[]).find(s=>s.id===+selectedId):null;
  return `<div class="cust-sw supp-sw" data-cs-id="${esc(id)}" data-kind="supplier">
    <input type="hidden" id="${esc(id)}" value="${selectedId||''}">
    <input type="text" id="${esc(id)}-input" class="cust-si" placeholder="جستجو: نام تأمین‌کننده..." value="${sel?esc(sel.name):''}">
    <div id="${esc(id)}-drop" class="cust-si-drop" style="display:none;position:fixed;width:280px;max-height:220px"></div>
  </div>`;
}
function showSupplierDrop(id, q){
  const drop=el(id+'-drop'); const inp=el(id+'-input'); if(!drop||!inp) return;
  const term=(q||'').trim().toLowerCase();
  let list=CACHE.suppliers||[];
  if(term){ const words=term.split(/\s+/); list=list.filter(s=>{const hay=((s.name||'')+' '+(s.phone||'')).toLowerCase(); return words.every(w=>hay.includes(w));}); }
  const rect=inp.getBoundingClientRect();
  drop.style.top=(rect.bottom+2)+'px'; drop.style.left=rect.left+'px'; drop.style.width=rect.width+'px'; drop.style.display='block';
  drop.innerHTML = list.slice(0,40).map(s=>`
    <div class="cust-si-item" onclick="pickSupplier('${id}',${s.id})">
      <span>${esc(s.name)}</span><span class="cust-si-meta">${esc(s.phone||'')}</span>
    </div>`).join('') || '<div class="cust-si-empty">تأمین‌کننده یافت نشد</div>';
}
function pickSupplier(id, supId){
  const h=el(id); if(h){ h.value=supId||''; h.dispatchEvent(new Event('change')); }
  const inp=el(id+'-input');
  if(inp){ const s=(CACHE.suppliers||[]).find(x=>x.id===+supId); inp.value=s?s.name:''; }
  hideSupplierDrop(id);
}
function hideSupplierDrop(id){ const drop=el(id+'-drop'); if(drop) drop.style.display='none'; }
function showCustDrop(id, q){
  const drop=el(id+'-drop'); if(!drop) return;
  const inp=el(id+'-input'); if(!inp) return;
  const optional=el(id)?.dataset?.optional==='1';
  const term=(q||'').trim().toLowerCase();
  let list=CACHE.customers;
  if(term){
    const words=term.split(/\s+/);
    list=list.filter(c=>{
      const hay=((c.biz||'')+' '+(c.phone||'')+' '+(c.owner||'')).toLowerCase();
      return words.every(w=>hay.includes(w));
    });
  }
  const rect=inp.getBoundingClientRect();
  drop.style.top=(rect.bottom+2)+'px';
  drop.style.left=rect.left+'px';
  drop.style.width=rect.width+'px';
  drop.style.display='block';
  let html='';
  if(optional) html+=`<div class="cust-si-item" onclick="pickCust('${id}',0)"><span>بدون مشتری</span></div>`;
  html+=list.slice(0,40).map(c=>`
    <div class="cust-si-item" onclick="pickCust('${id}',${c.id})">
      <span>${esc(c.biz)}</span>
      <span class="cust-si-meta">${esc(c.phone||'')}</span>
    </div>`).join('');
  if(!html) html='<div class="cust-si-empty">مشتری یافت نشد</div>';
  drop.innerHTML=html;
}
function pickCust(id, custId){
  const h=el(id); if(h){ h.value=custId||''; h.dispatchEvent(new Event('change')); }
  const inp=el(id+'-input');
  if(inp){
    if(custId){
      const c=CACHE.customers.find(x=>x.id===+custId);
      inp.value=c?c.biz:'';
    } else { inp.value=''; }
  }
  hideCustDrop(id);
}
function hideCustDrop(id){
  const drop=el(id+'-drop'); if(drop) drop.style.display='none';
}

/* ---- Datepicker popup ---- */
let DP = { input:null, y:0, m:0, sel:null };
function attachDatepickers(scope){
  (scope||document).querySelectorAll('input[data-jdate]').forEach(inp=>{
    if(inp.dataset.dpBound) return;
    inp.dataset.dpBound='1';
    inp.readOnly = true;
    inp.style.cursor='pointer';
    inp.addEventListener('click', (e)=>{ e.stopPropagation(); openDP(inp); });
    inp.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' ') openDP(inp); });
  });
}
function openDP(inp){
  DP.input = inp;
  const today = todayJalali().split('/');
  const parts = (inp.value||'').split('/').map(x=>parseInt(x));
  if(parts.length===3 && parts[0]>=1300 && parts[0]<=1500 && parts[1]>=1 && parts[1]<=12){
    DP.y=parts[0]; DP.m=parts[1]; DP.sel=inp.value;
  } else {
    DP.y=+today[0]; DP.m=+today[1]; DP.sel=null;
  }
  DP.y=Math.max(1300,Math.min(1500,DP.y));
  DP.m=Math.max(1,Math.min(12,DP.m));
  el('dpOverlay').classList.add('open');
  renderDP();
  positionDP(inp);
}
function closeDP(){
  const dp=el('dpRoot').querySelector('.dp');
  if(dp) dp.classList.remove('open');
  el('dpOverlay').classList.remove('open');
  DP.input=null;
}
function renderDP(){
  const firstG = _j2g(DP.y, DP.m, 1);
  const fd = new Date(firstG[0], firstG[1]-1, firstG[2]);
  const startW = (fd.getDay()+1)%7; // Jalali week: Sat=0
  const dim = _jDIM(DP.m, DP.y);
  const tj = todayJalali();
  let cells='';
  for(let i=0;i<startW;i++) cells+='<button class="empty" aria-hidden="true"></button>';
  for(let d=1;d<=dim;d++){
    const val = DP.y+'/'+String(DP.m).padStart(2,'0')+'/'+String(d).padStart(2,'0');
    let cls=''; if(val===tj) cls+=' today'; if(val===DP.sel) cls+=' sel';
    cells+=`<button class="${cls.trim()}" onclick="pickDay(${d})" aria-label="${J_MONTHS[DP.m-1]} ${d}">${toFa(d)}</button>`;
  }
  const yearOpts = [];
  for(let y=1380;y<=1425;y++) yearOpts.push(`<option value="${y}" ${y===DP.y?'selected':''}>${toFa(y)}</option>`);
  el('dpRoot').innerHTML = `<div class="dp open" onclick="event.stopPropagation()">
    <div class="dp-nav">
      <button onclick="dpNav(-1)" title="ماه قبل">‹</button>
      <span class="dp-month-lbl">${J_MONTHS[DP.m-1]}</span>
      <select onchange="DP.y=parseInt(this.value);renderDP()" title="انتخاب سال">${yearOpts.join('')}</select>
      <button onclick="dpNav(1)" title="ماه بعد">›</button>
    </div>
    <div class="dp-week">${J_WEEK.map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="dp-days">${cells}</div>
    <div class="dp-foot">
      <button class="today-btn" onclick="pickToday()">امروز</button>
      <button class="clear-btn" onclick="pickClear()">پاک</button>
    </div>
  </div>`;
  positionDP(DP.input);
}
function positionDP(inp){
  const dp=el('dpRoot').querySelector('.dp'); if(!dp) return;
  if(window.innerWidth<=480){ dp.style.cssText=''; return; }
  if(!inp){ dp.style.right='50%'; dp.style.top='50%'; return; }
  const r=inp.getBoundingClientRect();
  const dpW=224, dpH=dp.offsetHeight||260;
  let right=Math.max(8, window.innerWidth-r.right);
  if(right+dpW>window.innerWidth-8) right=Math.max(8, window.innerWidth-dpW-8);
  let top = (r.bottom+dpH+6>window.innerHeight && r.top-dpH-6>0) ? r.top-dpH-6 : r.bottom+4;
  if(top<8) top=8;
  dp.style.right=right+'px'; dp.style.top=top+'px'; dp.style.left='auto'; dp.style.bottom='auto';
}
function dpNav(dir){
  DP.m+=dir;
  if(DP.m>12){DP.m=1;DP.y=Math.min(1420,DP.y+1);}
  if(DP.m<1){DP.m=12;DP.y=Math.max(1390,DP.y-1);}
  renderDP();
}
function pickDay(d){
  const val = DP.y+'/'+String(DP.m).padStart(2,'0')+'/'+String(d).padStart(2,'0');
  if(DP.input){ DP.input.value=val; DP.input.dispatchEvent(new Event('change')); }
  closeDP();
}
function pickToday(){ if(DP.input){ DP.input.value=todayJalali(); DP.input.dispatchEvent(new Event('change')); } closeDP(); }
function pickClear(){ if(DP.input){ DP.input.value=''; DP.input.dispatchEvent(new Event('change')); } closeDP(); }
document.addEventListener('click',(e)=>{ const dp=el('dpRoot').querySelector('.dp'); if(dp && dp.classList.contains('open') && !e.target.closest('.dp') && e.target!==DP.input) closeDP(); });
// Single global handler for customer search dropdowns — avoids accumulation per modal open
document.addEventListener('click',e=>{ if(!e.target.closest('.cust-sw')) document.querySelectorAll('.cust-si-drop').forEach(d=>{d.style.display='none';}); },true);

============================================================ */
el('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  el('loginErr').textContent='';
  const username = el('loginUser').value.trim();
  const password = el('loginPass').value;
  if(!username || !password){ el('loginErr').textContent='نام کاربری و رمز را وارد کنید'; return; }
  try{
    const r = await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const j = await r.json();
    if(!r.ok){ el('loginErr').textContent = j.error || 'خطا در ورود'; return; }
    localStorage.setItem('crm_token', j.token);
    localStorage.setItem('crm_user', JSON.stringify(j.user));
    ME = j.user;
    await boot();
  }catch(err){ el('loginErr').textContent='خطای ارتباط با سرور'; }
});

function logout(){
  localStorage.removeItem('crm_token');
  localStorage.removeItem('crm_user');
  ME=null;
  el('app').style.display='none';
  el('login').style.display='flex';
}

/* ============================================================
   OFFLINE SYNC UI (device builds only)
   The desktop/mobile apps run an embedded local server (SYNC_ROLE=device)
   that exposes /api/sync/status. On the central web server that endpoint
   doesn't exist, so this whole UI stays dormant there.
============================================================ */
let SYNC_MODE = false, SYNC_STATUS = null;

async function fetchSyncStatus(){
  const token = localStorage.getItem('crm_token');
  const r = await fetch('/api/sync/status',{headers:{'Authorization':'Bearer '+token}});
  if(!r.ok) return null;
  return await r.json();
}

let _lastDataVersion = null;
async function initSyncUI(){
  try{
    SYNC_STATUS = await fetchSyncStatus();
    if(!SYNC_STATUS || SYNC_STATUS.role!=='device') return;
    SYNC_MODE = true;
    _lastDataVersion = SYNC_STATUS.data_version;
    renderSyncBadge();
    setInterval(async ()=>{ try{
      SYNC_STATUS=await fetchSyncStatus(); renderSyncBadge();
      maybeRefreshAfterSync();
    }catch(e){} }, 20000);
    if(!SYNC_STATUS.paired && isAdmin()) openSyncPairModal();
  }catch(e){ /* central server — no sync UI */ }
}

// When a background sync changed local data (id remap, pulled rows/deletes),
// drop stale caches and re-render the current view — otherwise the browser
// keeps showing old ids (delete → "یافت نشد") or already-deleted rows.
function maybeRefreshAfterSync(){
  if(!SYNC_STATUS || SYNC_STATUS.data_version==null) return;
  if(_lastDataVersion===null){ _lastDataVersion=SYNC_STATUS.data_version; return; }
  if(SYNC_STATUS.data_version===_lastDataVersion) return;
  _lastDataVersion = SYNC_STATUS.data_version;
  // invalidate cached lists so the next render re-fetches from the local DB
  CACHE.customers=[]; CACHE.products=[]; CACHE.allProducts=[]; CACHE.invoices=[];
  if(document.querySelector('.overlay.open')) return; // don't yank a modal the user is filling
  if(IN_ACC_SHELL){ if(typeof accTab!=='undefined' && accTab) loadAccTab(accTab); }
  else { reloadCustomers().then(()=>{ if(CURRENT_PAGE) go(CURRENT_PAGE); }).catch(()=>{ if(CURRENT_PAGE) go(CURRENT_PAGE); }); }
}

function renderSyncBadge(){
  const b = el('syncBadge'); if(!b || !SYNC_STATUS) return;
  b.style.display='inline-block';
  const s = SYNC_STATUS;
  if(!s.paired){
    b.textContent='🔗 اتصال به سرور مرکزی'; b.style.background='#fef3c7'; b.style.color='#b45309';
  } else if(s.conflicts>0){
    b.textContent=`⚠️ ${fmt(s.conflicts)} تعارض`; b.style.background='#fee2e2'; b.style.color='#b91c1c';
  } else if(s.syncing){
    b.textContent='🔄 در حال همگام‌سازی...'; b.style.background='#dbeafe'; b.style.color='#1d4ed8';
  } else if(!s.online){
    b.textContent=`📡 آفلاین${s.pending?` · ${fmt(s.pending)} در صف`:''}`; b.style.background='#f3f4f6'; b.style.color='#6b7280';
  } else if(s.pending>0){
    b.textContent=`🔄 ${fmt(s.pending)} در انتظار ارسال`; b.style.background='#fef3c7'; b.style.color='#b45309';
  } else {
    b.textContent='🟢 همگام با مرکز'; b.style.background='#dcfce7'; b.style.color='#15803d';
  }
}

  if(!s.paired){ if(isAdmin()) openSyncPairModal(); else showToast('دستگاه هنوز متصل نشده — از مدیر سیستم بخواهید اتصال را انجام دهد','error'); return; }
  const token = localStorage.getItem('crm_token');
  const [pending, conflicts] = await Promise.all([
    fetch('/api/sync/pending',{headers:{'Authorization':'Bearer '+token}}).then(r=>r.ok?r.json():[]),
    fetch('/api/sync/conflicts',{headers:{'Authorization':'Bearer '+token}}).then(r=>r.ok?r.json():[])
  ]);
  const opLabel = o=>{
    const act = o.method==='POST'?'ثبت':o.method==='DELETE'?'حذف':'ویرایش';
    const ent = {invoices:'فاکتور',customers:'مشتری',settlements:'تسویه',sales_returns:'برگشت از فروش',purchase_invoices:'فاکتور خرید',purchase_returns:'برگشت از خرید',supplier_payments:'پرداخت تأمین‌کننده',expense_payments:'هزینه',account_transfers:'انتقال وجه',followups:'پیگیری',products:'محصول',suppliers:'تأمین‌کننده',persons:'شخص',journal_entries:'سند دستی',payroll_records:'حقوق'}[o.entity_table]||o.entity_table||o.path;
    return `${act} ${ent}`;
  };
  openModal(`
    <div class="modal-head"><h3>🔄 همگام‌سازی با سرور مرکزی</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
        <span class="tag ${s.online?'t-done':'t-cancel'}">${s.online?'🟢 متصل به مرکز':'📡 آفلاین'}</span>
        <span class="tag">${fmt(s.pending)} عملیات در صف</span>
        <span class="tag ${s.conflicts?'t-cancel':'t-done'}">${fmt(s.conflicts)} تعارض</span>
        ${s.last_sync_at?`<span class="tag">آخرین همگام‌سازی: ${new Date(s.last_sync_at*1000).toLocaleTimeString('fa-IR')}</span>`:''}
      </div>
      ${s.last_error?`<div style="background:#fee2e2;color:#b91c1c;border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:12px">${esc(s.last_error)}</div>`:''}
      <button class="btn" style="margin-bottom:14px" onclick="syncNowUI()">🔄 همگام‌سازی اکنون</button>
      ${pending.filter(p=>p.status==='pending').length?`
        <h4 style="margin:10px 0 6px">⏳ در صف ارسال</h4>
        <div class="tbl-wrap"><table class="tbl" style="font-size:12px"><tbody>
          ${pending.filter(p=>p.status==='pending').map(o=>`<tr><td>${esc(opLabel(o))}</td><td class="mono muted">${new Date((o.created_at||0)*1000).toLocaleString('fa-IR')}</td></tr>`).join('')}
        </tbody></table></div>`:''}
      ${conflicts.length?`
        <h4 style="margin:14px 0 6px;color:var(--red)">⚠️ تعارض‌ها — نیاز به تصمیم شما</h4>
        <p class="muted" style="font-size:12px;margin-bottom:8px">این عملیات‌ها روی سرور مرکزی پذیرفته نشدند (مثلاً موجودی کافی نبود). می‌توانید آن‌ها را «لغو» کنید تا اثر محلی‌شان برگردد، و در صورت نیاز عملیات را با شرایط جدید دوباره ثبت کنید.</p>
        <div class="tbl-wrap"><table class="tbl" style="font-size:12px"><thead><tr><th>عملیات</th><th>علت رد شدن</th><th></th></tr></thead><tbody>
          ${conflicts.map(c=>`<tr>
            <td>${esc(opLabel(c))}</td>
            <td style="color:var(--red)">${esc(c.reason||'-')}</td>
            <td><button class="btn sm red" onclick="discardSyncConflict(${c.id})">🗑️ لغو عملیات</button></td>
          </tr>`).join('')}
        </tbody></table></div>`:''}
    </div>`, true);
}

async function syncNowUI(){
  const token = localStorage.getItem('crm_token');
  showToast('همگام‌سازی شروع شد...');
  const r = await fetch('/api/sync/now',{method:'POST',headers:{'Authorization':'Bearer '+token}});
  const j = await r.json().catch(()=>({}));
  if(j.ok){ showToast(`همگام‌سازی انجام شد (${fmt(j.confirmed||0)} عملیات تأیید شد)`); }
  else showToast(j.error||'همگام‌سازی ناموفق بود','error');
  SYNC_STATUS = await fetchSyncStatus(); renderSyncBadge();
  closeModal();
  maybeRefreshAfterSync(); // refresh lists/ids if sync changed local data
}

async function discardSyncConflict(outboxId){
  if(!confirm('این عملیات به‌طور کامل لغو و اثر محلی آن برگردانده شود؟')) return;
  const token = localStorage.getItem('crm_token');
  const r = await fetch('/api/sync/conflicts/'+outboxId+'/discard',{method:'POST',headers:{'Authorization':'Bearer '+token}});
  const j = await r.json().catch(()=>({}));
  if(j.ok){ showToast('عملیات لغو شد'); SYNC_STATUS=await fetchSyncStatus(); renderSyncBadge(); closeModal(); openSyncPanel(); }
  else showToast(j.error||'لغو ناموفق بود','error');
}

async function doSyncPair(){
  const central_url = el('pair-url').value.trim();
  const username = el('pair-user').value.trim();
  const password = el('pair-pass').value;
  const device_name = el('pair-name').value.trim() || 'دستگاه آفلاین';
  if(!central_url||!username||!password){ showToast('همه فیلدهای ستاره‌دار الزامی است','error'); return; }
  showToast('در حال اتصال و دریافت اطلاعات از سرور مرکزی...');
  const token = localStorage.getItem('crm_token');
  const r = await fetch('/api/sync/pair-device',{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body: JSON.stringify({central_url,username,password,device_name})});
  const j = await r.json().catch(()=>({}));
  if(j.ok){
    showToast('دستگاه با موفقیت متصل شد — اطلاعات دریافت شد');
    closeModal();
    // The placeholder admin was replaced by central's real users — re-login required
    setTimeout(()=>{ alert('اتصال انجام شد. لطفاً با نام کاربری و رمز عبور اصلی خود (همان سرور مرکزی) دوباره وارد شوید.'); logout(); }, 800);
  } else {
    showToast(j.error||'اتصال ناموفق بود','error');
  }
}

function statCard(c,ic,v,l){ return `<div class="stat"><div class="ic ${c}">${ic}</div><div><div class="v mono">${v}</div><div class="l">${l}</div></div></div>`; }
function fitStatNums(){
  requestAnimationFrame(()=>{
    document.querySelectorAll('.stat .v').forEach(el=>{
      el.style.fontSize='';
      let fs=parseInt(getComputedStyle(el).fontSize)||20;
      // shrink until text fits inside its own box (scrollWidth = real text width; clientWidth = visible box width)
      while(el.scrollWidth>el.clientWidth+1&&fs>11){fs--;el.style.fontSize=fs+'px';}
    });
  });
}
function emptyRow(cols){ return `<tr><td colspan="${cols}" class="empty">موردی یافت نشد</td></tr>`; }

function toggleCust(id, checked){ if(checked) custSelected.add(id); else custSelected.delete(id); renderCustTable(); }
function toggleAllCust(cb, ids){ ids.forEach(id=>cb.checked?custSelected.add(id):custSelected.delete(id)); renderCustTable(); }
async function bulkCustStatus(status){
  if(!custSelected.size) return;
  if(!confirm(`وضعیت ${custSelected.size} مشتری به "${STATUS_LABEL[status]||status}" تغییر کند؟`)) return;
  for(const id of custSelected){
    const c = CACHE.customers.find(x=>x.id===id); if(!c) continue;
    await api('PUT','/customers/'+id,{...c, status});
  }
  custSelected.clear(); await reloadCustomers(); renderCustTable(); showToast('وضعیت‌ها به‌روز شد');
}
async function bulkCustDelete(){
  if(!custSelected.size) return;
  if(!confirm(`${custSelected.size} مشتری حذف شود؟ این عمل برگشت‌پذیر نیست!`)) return;
  for(const id of custSelected) await api('DELETE','/customers/'+id);
  custSelected.clear(); await reloadCustomers(); renderCustTable(); showToast('حذف شد');
}
async function sendWelcomeSMS(id){
  const c = CACHE.customers.find(x=>x.id===id);
  if(!c?.phone){ showToast('این مشتری شماره موبایل ندارد','error'); return; }
  showToast('در حال ارسال پیامک...');
  const r = await api('POST','/customers/'+id+'/welcome-sms');
  if(r?.ok) showToast(`✅ پیامک خوش‌آمدگویی به ${c.biz} ارسال شد`);
  else showToast('❌ خطا: '+(r?.reason||r?.error||JSON.stringify(r?.data||'')),'error');
}
async function bulkWelcomeSMS(){
  if(!custSelected.size) return;
  const custs = CACHE.customers.filter(c=>custSelected.has(c.id)&&c.phone);
  if(!custs.length){ showToast('هیچ مشتری انتخاب‌شده‌ای شماره موبایل ندارد','error'); return; }
  if(!confirm(`پیامک خوش‌آمدگویی برای ${custs.length} مشتری ارسال شود؟`)) return;
  let ok=0, fail=0;
  for(const c of custs){
    const r = await api('POST','/customers/'+c.id+'/welcome-sms');
    if(r?.ok) ok++; else fail++;
  }
  showToast(`📤 ارسال پیامک: ✅ ${ok} موفق${fail?' — ❌ '+fail+' ناموفق':''}`);
}

async function saveCust(id){
  const data = {
    biz:el('c-biz').value.trim(), owner:el('c-owner').value,
    province:el('c-province')?.value||'', city:el('c-city')?.value||'',
    address:el('c-address')?.value||'',
    phone:el('c-phone').value, insta:el('c-insta').value, type:el('c-type').value,
    status:el('c-status').value, note:el('c-note').value,
    source:el('c-source')?.value||'',
    auto_followup: el('c-autofollow') ? (el('c-autofollow').checked ? 1 : 0) : 1
  };
  if(canAccounting()){
    if(el('c-balance')) data.balance = moneyVal('c-balance');
    if(el('c-group_id')) data.group_id = +el('c-group_id').value||null;
  }

};

function importCustomers(){

function setFupView(v){

function filterFups(){
  let rows=CACHE.followups.slice();
  if(fupFilter.q){const q=fupFilter.q.toLowerCase();rows=rows.filter(f=>((f.cust_biz||'')+' '+(f.subject||'')+' '+(f.note||'')+' '+(f.tags||'')).toLowerCase().includes(q));}
  if(fupFilter.status)rows=rows.filter(f=>f.status===fupFilter.status);
  if(fupFilter.stage)rows=rows.filter(f=>(f.pipeline_stage||'lead')===fupFilter.stage);
  return rows;
}

function toggleFupFolder(gi){
  const body=el('ffBody'+gi), arrow=el('ffArrow'+gi); if(!body) return;

async function saveFup(id){
  const cust_id=+el('f-cust').value;
  if(!cust_id){ showToast('مشتری را انتخاب کنید','error'); return; }
  const data={
    cust_id, date:el('f-date').value, type:el('f-type').value,
    priority:el('f-priority').value, subject:el('f-subject').value,
    note:el('f-note').value, action:el('f-action').value,
    next_date:el('f-next').value, next_time:el('f-next-time')?.value||'',
    status:el('f-status').value,
    interest_level:el('f-interest').value,
    purchase_prob:parseInt(el('f-prob').value)||50,
    pipeline_stage:el('f-stage').value,
    tags:el('f-tags').value,
    lost_reason:el('f-lost')?.value||'',
    assigned_to:el('f-assigned')?.value||null
  };
  try{
    if(id) await api('PUT','/followups/'+id,data); else await api('POST','/followups',data);
    CACHE.followups=await api('GET','/followups'); closeModal(); renderFupView(); showToast('ذخیره شد');
  }catch(e){}

function renderInvPicker(){
  const words=(el('invProdSearch')?.value||'').trim().toLowerCase().split(/\s+/).filter(Boolean);
  let prods=(CACHE.allProducts.length?CACHE.allProducts:CACHE.products).slice();
  if(words.length) prods=prods.filter(p=>{
    const hay=((p.name||'')+' '+(p.code||'')+' '+(p.category||'')).toLowerCase();
    return words.every(w=>hay.includes(w));
  });
  el('invPicker').innerHTML = prods.map(p=>{
    // Real-time available stock = current stock minus qty already reserved in this invoice's cart
    const reserved=invCart.filter(r=>r.product_id===p.id).reduce((a,r)=>a+r.qty,0);
    const avail=(p.stock||0)-reserved;
    return `
    <div class="pick-card" id="pc-${p.id}" onclick="pickCardTap(event,${p.id})">
      <div class="pimg">${p.image?`<img src="/uploads/products/${esc(p.image)}" loading="lazy" decoding="async">`:'🧥'}</div>
      <div class="pn">${esc(p.name)}</div>
      <div class="pp">${fmt(p.price)} ت</div>
      <div class="pst" style="font-size:11px;font-weight:700;color:${avail<=0?'var(--red)':avail<=(p.stock_alert||5)?'var(--orange)':'var(--green)'}">موجودی: ${fmt(avail)}</div>
    </div>`;
  }).join('') || '<div class="empty">محصولی نیست</div>';
}
function addToCart(pid){
  const p = CACHE.products.find(x=>x.id===pid); if(!p) return;
  const ex = invCart.find(r=>r.product_id===pid);
  const defaultQty = p.pack_size > 1 ? p.pack_size : 1;
  if(ex) ex.qty += defaultQty; else invCart.push({product_id:pid,name:p.name,qty:defaultQty,price:p.price,disc:0});
  renderCart();
  renderInvPicker(); // stock badges must reflect the newly reserved quantity immediately
}
let _pickTap={};
function pickCardTap(e,pid){
  const isMobile = window.matchMedia('(hover:none)').matches;
  if(!isMobile){ addToCart(pid); return; }
  const now=Date.now();
  if(_pickTap.id===pid && now-_pickTap.t<400){
    // double-tap confirmed
    addToCart(pid);
    _pickTap={};
    const card=el('pc-'+pid); if(card){card.style.outline='2px solid var(--green)';setTimeout(()=>{card.style.outline='';},500);}
  } else {
    // first tap: highlight, wait for second
    document.querySelectorAll('.pick-card').forEach(c=>c.style.outline='');
    const card=el('pc-'+pid); if(card) card.style.outline='2px solid var(--purple)';
    _pickTap={id:pid,t:now};
  }
}
function renderCart(){
  const showLineDisc=canAccounting();
  el('cartRows').innerHTML = invCart.map((r,i)=>{
    const gross=r.qty*r.price;
    const lineDisc=showLineDisc?(r.disc||0):0;
    const lineDiscAmt=Math.round(gross*lineDisc/100);
    return `
    <div class="cart-row">
      <span class="cn">${esc(r.name)}</span>
      <input type="number" min="1" value="${r.qty}" onchange="invCart[${i}].qty=Math.max(1,+this.value||1);renderCart();renderInvPicker()">
      <input class="price-in" type="number" value="${r.price}" onchange="invCart[${i}].price=+this.value||0;renderCart()">
      ${showLineDisc?`<input type="number" min="0" max="100" title="تخفیف ردیف (٪)" value="${r.disc||0}" style="width:52px" onchange="invCart[${i}].disc=Math.min(100,Math.max(0,+this.value||0));renderCart()">`:''}
      <button class="rm" onclick="invCart.splice(${i},1);renderCart();renderInvPicker()">×</button>
    </div>${showLineDisc&&lineDiscAmt>0?`<div class="muted" style="font-size:11px;margin:-4px 0 6px;padding-right:2px">تخفیف ردیف: ${fmt(lineDiscAmt)} ت</div>`:''}`;
  }).join('') || '<div class="muted center" style="padding:14px">سبد خالی است</div>';
  // Mirrors the server's calculation exactly: line discount first, then overall invoice discount on the result
  const subtotal = invCart.reduce((a,r)=>{
    const gross=r.qty*r.price;
    const lineDiscAmt=showLineDisc?Math.round(gross*(r.disc||0)/100):0;
    return a+(gross-lineDiscAmt);
  },0);
  const disc = +(el('inv-disc')?.value||0);
  const discAmt = Math.round(subtotal*disc/100);
  const final = subtotal-discAmt;
  el('cartTot').innerHTML = `
    <div class="l"><span>جمع کل (پس از تخفیف ردیف‌ها):</span><span class="mono">${fmt(subtotal)} ت</span></div>
    <div class="l"><span>تخفیف کل فاکتور (${fmt(disc)}٪):</span><span class="mono">${fmt(discAmt)} ت</span></div>
    <div class="l final"><span>نهایی:</span><span class="mono">${fmt(final)} ت</span></div>`;
}
function toggleChequeFields(){
  const pt = el('inv-pay-type')?.value;
  const cf = el('chequeFields');
  if(cf) cf.style.display = pt==='cheque' ? '' : 'none';
}
async function saveInvoice(id){
  const cust_id = +el('inv-cust').value;
  if(!cust_id){ showToast('مشتری را انتخاب کنید','error'); return; }
  if(invCart.length===0){ showToast('حداقل یک محصول اضافه کنید','error'); return; }
  const pay_type = el('inv-pay-type')?.value || 'cash';
  const data = {
    cust_id, type:el('inv-type').value, date:el('inv-date').value, note:el('inv-note').value,
    disc:+el('inv-disc').value||0,
    pay_type,
    cheque_duration: pay_type==='cheque' ? (el('inv-cheque-dur')?.value||'') : '',
    cheque_due_date: pay_type==='cheque' ? (el('inv-cheque-due')?.value||'') : '',
    cheque_info: pay_type==='cheque' ? (el('inv-cheque-info')?.value||'') : '',
    rows: invCart.map(r=>({product_id:r.product_id, qty:r.qty, price:r.price, disc:r.disc||0}))
  };
  try{
    if(id) await api('PUT','/invoices/'+id,data); else await api('POST','/invoices',data);
    CACHE.invoices=await api('GET','/invoices'); closeModal();
    if(el('invTable')) renderInvTable();
    else if(IN_ACC_SHELL && accTab==='sales-invoices') loadAccTab('sales-invoices');
    showToast('فاکتور ذخیره شد');
  }catch(e){}
}
async function convertProforma(id){
  if(!confirm('پیش‌فاکتور به فاکتور رسمی تبدیل شود؟')) return;
  try{
    await api('POST','/invoices/'+id+'/convert',{});
    CACHE.invoices = await api('GET','/invoices');
    renderInvTable();
    showToast('تبدیل شد');
  }catch(e){}
}
async function printInvoice(id, paper){
  if(!paper){
    openModal(`
      <div class="modal-head"><h3>🖨️ انتخاب کاغذ</h3><button class="x" onclick="closeModal()">×</button></div>
      <div class="modal-body" style="padding:24px">
        <p style="margin-bottom:16px;color:var(--muted)">سایز کاغذ چاپ را انتخاب کنید:</p>
        <div style="display:flex;gap:12px;justify-content:center">
          <button class="btn" style="flex:1;padding:16px;font-size:15px" onclick="closeModal();printInvoice(${id},'A4')">📄 A4<br><small>۲۱ × ۲۹.۷ سانتی‌متر</small></button>
          <button class="btn ghost" style="flex:1;padding:16px;font-size:15px" onclick="closeModal();printInvoice(${id},'A5')">📄 A5<br><small>۱۴.۸ × ۲۱ سانتی‌متر</small></button>
        </div>
      </div>`);
    return;
  }
  const token = localStorage.getItem('crm_token');
  try{
    const r = await fetch('/api/invoices/'+id+'/print?paper='+paper,{headers:{'Authorization':'Bearer '+token}});
    if(!r.ok){ showToast('خطا در دریافت فاکتور','error'); return; }
    let html = await r.text();
    // about:blank has no base URL — anchor relative paths (logo) to the app origin
    html = html.replace(/<head>/i,'<head><base href="'+location.origin+'/">');
    const w = window.open('','_blank');
    w.document.write(html); w.document.close();
  }catch(e){ showToast('خطا در چاپ','error'); }
}

async function saveProduct(id){
  const name = el('p-name').value.trim();
  if(!name){ showToast('نام محصول الزامی است','error'); return; }
  const fd = new FormData();
  fd.append('name',name);
  fd.append('category',el('p-cat').value.trim());
  fd.append('code',el('p-code').value);
  fd.append('price',moneyVal('p-price'));
  fd.append('cost',moneyVal('p-cost'));
  fd.append('stock',el('p-stock').value);
  fd.append('stock_alert',el('p-alert').value||5);
  fd.append('unit',el('p-unit').value||'عدد');
  fd.append('colors',el('p-colors')?.value||1);
  fd.append('pack_size',el('p-pack_size')?.value||1);
  fd.append('note',el('p-note').value);
  const f = el('p-image').files[0];
  if(f) fd.append('image',f);
  try{
    if(id) await api('PUT','/products/'+id,fd,true); else await api('POST','/products',fd,true);
    closeModal();
    await _refreshProdWithCats(_prodCanEdit);
    showToast('ذخیره شد');
  }catch(e){ showToast('خطا در ذخیره محصول','error'); }
}
function importProducts(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.xlsx,.xls';
  inp.onchange=async()=>{
    const fd=new FormData(); fd.append('file',inp.files[0]);
    try{ const r=await api('POST','/products/import',fd,true); showToast(`${fmt(r.inserted)} محصول اضافه شد`); await refreshProd(true); }catch(e){}
  };
  inp.click();
}
function downloadTemplate(){ downloadAuth('/products/template','products-template.xlsx'); }
function exportExcel(entity){ downloadAuth('/'+entity+'/export/excel', entity+'.xlsx'); }
async function downloadAuth(path,filename){
  const token=localStorage.getItem('crm_token');
  try{
    const r=await fetch('/api'+path,{headers:{'Authorization':'Bearer '+token}});
    if(!r.ok){ showToast('خطا در دانلود','error'); return; }
    const blob=await r.blob();
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
    URL.revokeObjectURL(a.href);
  }catch(e){ showToast('خطا در دانلود','error'); }
}

let _pendingUserSave = null;
async function saveUser(id){
  const name=el('u-name').value.trim(), username=el('u-username').value.trim(),
        pass=el('u-pass').value, role=el('u-role').value,
        phone=el('u-phone').value, active=+el('u-active').value,
        commission_cash=parseFloat(el('u-comm-cash')?.value||0)||0,
        commission_cheque=parseFloat(el('u-comm-cheque')?.value||0)||0;
  if(!name){ showToast('نام الزامی است','error'); return; }
  const commInput=el('u-comm-cash');
  const isLocked=commInput?.dataset.locked==='1';
  const origCash=parseFloat(commInput?.dataset.orig||0);
  const origCheque=parseFloat(el('u-comm-cheque')?.dataset.orig||0);
  const rateChanged=id&&(Math.abs(commission_cash-origCash)>0.001||Math.abs(commission_cheque-origCheque)>0.001);
  if(id && isLocked && rateChanged){
    _pendingUserSave={id,name,username,pass,role,phone,active,commission_cash,commission_cheque};
    openModal(`
      <div class="modal-head"><h3>🔒 تغییر نرخ انگیزه فروش</h3><button class="x" onclick="closeModal()">×</button></div>
      <div class="modal-body">
        <p style="margin-bottom:12px">نرخ انگیزه فروش <b>${esc(name)}</b> قفل است.</p>
        <p style="margin-bottom:16px;color:var(--muted);font-size:13px">نقد: ${origCash}٪ ← ${commission_cash}٪ &nbsp;|&nbsp; چک: ${origCheque}٪ ← ${commission_cheque}٪</p>
        <p>آیا می‌خواهید محاسبه انگیزه فروش همه فاکتورهای قبلی این کارشناس با نرخ جدید مجدداً انجام شود؟</p>
      </div>
      <div class="modal-foot">
        <button class="btn green" onclick="confirmIncentiveChange(true)">بله، همه فاکتورها محاسبه مجدد شوند</button>
        <button class="btn ghost" onclick="closeModal()">انصراف (بدون تغییر نرخ)</button>
      </div>`);
    return;
  }
  await _doSaveUser(id,{name,username,pass,role,phone,active,commission_cash,commission_cheque});
}
async function confirmIncentiveChange(yes){
  closeModal();
  if(!_pendingUserSave) return;
  const {id,...data}=_pendingUserSave; _pendingUserSave=null;
  if(yes) await _doSaveUser(id,{...data,force:true});
}
async function _doSaveUser(id,{name,username,pass,role,phone,active,commission_cash,commission_cheque,force}){
  try{
    if(id){
      await api('PUT','/admin/users/'+id,{name,role,phone,active,password:pass||undefined,commission_cash,commission_cheque,force:force||undefined});
    } else {
      if(!username||!pass){ showToast('نام کاربری و رمز الزامی است','error'); return; }
      await api('POST','/admin/users',{name,username,password:pass,phone,role,commission_cash,commission_cheque});
    }
    CACHE.users=await api('GET','/auth/users'); closeModal(); ROUTES.users(); showToast('ذخیره شد');
  }catch(e){}
}
async function resetPass(id,name){
  const np = prompt('رمز جدید برای '+name+':');
  if(!np) return;
  await api('POST','/auth/reset-password',{user_id:id,new_pass:np});
  showToast('رمز بازنشانی شد');
}

// Generic wrapper: every accounting page shares the same header (title + optional
// date-range filter) and delegates the body to loadAccTab(tabKey).
function renderAccPage(tabKey, icon, title){
  accTab = tabKey;
  if(accPreset!=='custom'&&accPreset!=='all'&&!accDateFrom) [accDateFrom,accDateTo]=jPresetRange(accPreset);
  const showFilter = !ACC_NOFILTER_TABS.has(tabKey);
  el('view').innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h4>${icon} ${title}</h4>
        ${showFilter?`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          ${presetSelect('accPresetSel',accPreset,'applyAccPreset')}
          ${accPreset==='custom'?`
          <input id="accFrom" data-jdate placeholder="از تاریخ" style="padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;width:120px;font-size:12px" value="${accDateFrom}" onchange="accDateFrom=this.value">
          <input id="accTo" data-jdate placeholder="تا تاریخ" style="padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;width:120px;font-size:12px" value="${accDateTo}" onchange="accDateTo=this.value">
          <button class="btn sm ghost" onclick="loadAccTab(accTab)">🔍 اعمال</button>
          <button class="btn sm ghost" onclick="accDateFrom='';accDateTo='';el('accFrom').value='';el('accTo').value='';loadAccTab(accTab)">✕</button>`:
          `<span class="tag" style="background:var(--purple-light);color:var(--purple)">${accDateFrom||'ابتدا'} تا ${accDateTo||'انتها'}</span>`}
          ${(tabKey==='general'&&isAdmin())?`<button class="btn sm ghost" title="بازسازی اسناد حسابداری برای همه عملیات گذشته" onclick="resyncAccounting()">🔄 همگام‌سازی</button>`:''}
        </div>`:''}
      </div>
      <div class="panel-body" id="accBody"><div class="muted">در حال بارگذاری...</div></div>
    </div>`;
  attachDatepickers(el('view'));
  loadAccTab(tabKey);
}

async function resyncAccounting(){
  if(!confirm('اسناد حسابداری برای تمام فاکتورها، تسویه‌ها و مانده‌های اولیه گذشته بازسازی شود؟\n(این عملیات ایمن است و اسناد تکراری ایجاد نمی‌کند)')) return;
  try{
    await api('POST','/accounting/backfill',{});
    showToast('حسابداری عملیات گذشته همگام‌سازی شد');
    loadAccTab(accTab);
  }catch(e){}
}

/* ============================================================
   GENERIC PRODUCT CART — shared by purchase/return modals
   (sales invoices keep their own invCart/pick-card grid; this is a
   simpler row-list picker suited to accounting-only, desktop-first forms)
============================================================ */
let genCart = [];
let genCartDiscInputId = null; // set per-modal; null = no overall discount
let GEN_CART_PRICE_FIELD = 'price'; // 'price' for sales-return, 'cost' for purchases
function genCartAdd(pid){
  const p = CACHE.products.find(x=>x.id===pid); if(!p) return;
  const ex = genCart.find(r=>r.product_id===pid);
  const defPrice = GEN_CART_PRICE_FIELD==='cost' ? (p.cost||0) : (p.price||0);
  if(ex) ex.qty++; else genCart.push({product_id:pid,name:p.name,qty:1,price:defPrice});
  renderGenCart();
}
function renderGenCart(){
  const rowsEl=el('genCartRows'); if(!rowsEl) return;
  rowsEl.innerHTML = genCart.map((r,i)=>`
    <div class="cart-row">
      <span class="cn">${esc(r.name)}</span>
      <input type="number" min="1" value="${r.qty}" onchange="genCart[${i}].qty=Math.max(1,+this.value||1);renderGenCart()">
      <input class="price-in" type="number" value="${r.price}" onchange="genCart[${i}].price=+this.value||0;renderGenCart()">
      <button class="rm" onclick="genCart.splice(${i},1);renderGenCart()">×</button>
    </div>`).join('') || '<div class="muted" style="padding:14px;text-align:center">ردیفی اضافه نشده</div>';
  const totEl=el('genCartTot'); if(!totEl) return;
  const subtotal=genCart.reduce((a,r)=>a+r.qty*r.price,0);
  if(genCartDiscInputId){
    const discPct=+el(genCartDiscInputId)?.value||0;
    const discAmt=Math.round(subtotal*discPct/100);
    totEl.innerHTML = `
      <div class="l"><span>جمع کل:</span><span class="mono">${fmt(subtotal)} ت</span></div>
      <div class="l"><span>تخفیف (${fmt(discPct)}٪):</span><span class="mono">${fmt(discAmt)} ت</span></div>
      <div class="l final"><span>نهایی:</span><span class="mono">${fmt(subtotal-discAmt)} ت</span></div>`;
  } else {
    totEl.innerHTML = `<div class="l final"><span>جمع:</span><span class="mono">${fmt(subtotal)} ت</span></div>`;
  }
}
function genProductSearchHtml(){
  return `<div style="position:relative">
    <input type="text" id="genProdSearch" class="search" style="width:100%;margin-bottom:10px" placeholder="جستجوی محصول برای افزودن..." oninput="genProdShowDrop(this.value)" onfocus="genProdShowDrop(this.value)">
    <div id="genProdDrop" class="cust-si-drop" style="display:none;position:fixed;width:280px;max-height:220px"></div>
  </div>`;
}
function genProdShowDrop(q){
  const drop=el('genProdDrop'), inp=el('genProdSearch'); if(!drop||!inp) return;
  const term=(q||'').trim().toLowerCase();
  let list=(CACHE.allProducts&&CACHE.allProducts.length?CACHE.allProducts:CACHE.products)||[];
  if(term){ const words=term.split(/\s+/); list=list.filter(p=>{const hay=((p.name||'')+' '+(p.code||'')).toLowerCase(); return words.every(w=>hay.includes(w));}); }
  const rect=inp.getBoundingClientRect();
  drop.style.top=(rect.bottom+2)+'px'; drop.style.left=rect.left+'px'; drop.style.width=rect.width+'px'; drop.style.display='block';
  drop.innerHTML = list.slice(0,40).map(p=>`
    <div class="cust-si-item" onclick="genCartAdd(${p.id});el('genProdSearch').value='';el('genProdDrop').style.display='none'">
      <span>${esc(p.name)}</span><span class="cust-si-meta">موجودی: ${fmt(p.stock||0)}</span>
    </div>`).join('') || '<div class="cust-si-empty">محصولی یافت نشد</div>';
}
document.addEventListener('click',e=>{ if(!e.target.closest('#genProdSearch')&&!e.target.closest('#genProdDrop')){ const d=el('genProdDrop'); if(d) d.style.display='none'; } });

async function saveConsignment(){
  const party_name=el('cs-party').value.trim();
  const product_id=+el('cs-product').value, qty=+el('cs-qty').value;
  if(!party_name){ showToast('نام طرف حساب الزامی است','error'); return; }
  if(!product_id||!qty){ showToast('کالا و تعداد معتبر الزامی است','error'); return; }
  try{
    await api('POST','/consignments',{
      direction:el('cs-direction').value, party_name, party_phone:el('cs-phone').value,
      product_id, qty, unit_price:+el('cs-price').value||0, date:el('cs-date').value, note:el('cs-note').value

async function setConsignmentStatus(id,status){
  const labels={settled:'تسویه شود',returned:'مسترد شود'};
  if(!confirm(`وضعیت این کالای امانی به «${labels[status]||status}» تغییر کند؟`)) return;
  try{ await api('PATCH','/consignments/'+id+'/status',{status}); showToast('وضعیت به‌روزرسانی شد'); loadAccTab('consignments'); }catch(e){}
}
async function deleteConsignment(id){
  if(!confirm('این رکورد حذف شود؟ در صورت باز بودن و ارسالی بودن، موجودی بازگردانده می‌شود.')) return;
  try{ await api('DELETE','/consignments/'+id); showToast('حذف شد'); loadAccTab('consignments'); }catch(e){}
}

// Searchable account picker for manual-voucher lines (spec item 8).
// Mirrors the product-search dropdown: a text input filters the chart of
// accounts by code or name as you type, and picking sets the line's code.
function acctSearchHtml(i, code){
  const a=(CACHE.chartOfAccounts||[]).find(x=>x.code===code);
  return `<div style="position:relative">
    <input type="text" id="vc-acct-${i}" class="search" style="width:100%" autocomplete="off"
      placeholder="جستجوی حساب: کد یا نام..." value="${a?esc(a.code+' — '+a.name):''}"
      oninput="vcAcctShow(${i},this.value)" onfocus="vcAcctShow(${i},this.value)"
      onblur="setTimeout(()=>{const d=el('vc-acctdrop-${i}');if(d)d.style.display='none'},200)">
    <div id="vc-acctdrop-${i}" class="cust-si-drop" style="display:none;position:fixed;width:280px;max-height:220px"></div>
  </div>`;
}
function vcAcctShow(i, q){
  const drop=el('vc-acctdrop-'+i), inp=el('vc-acct-'+i); if(!drop||!inp) return;
  const term=(q||'').trim().toLowerCase();
  let list=(CACHE.chartOfAccounts||[]);
  if(term){ const words=term.split(/\s+/); list=list.filter(a=>{const hay=((a.code||'')+' '+(a.name||'')).toLowerCase(); return words.every(w=>hay.includes(w));}); }
  const rect=inp.getBoundingClientRect();
  drop.style.top=(rect.bottom+2)+'px'; drop.style.left=rect.left+'px'; drop.style.width=rect.width+'px'; drop.style.display='block';
  drop.innerHTML = list.slice(0,50).map(a=>`
    <div class="cust-si-item" onmousedown="vcAcctPick(${i},'${esc(a.code)}')">
      <span>${esc(a.name)}</span><span class="cust-si-meta">${esc(a.code)}${a.type?' · '+esc(ACC_TYPE_FA[a.type]||a.type):''}</span>
    </div>`).join('') || '<div class="cust-si-item muted">حسابی یافت نشد</div>';
}
function vcAcctPick(i, code){
  voucherLines[i].code=code;
  const a=(CACHE.chartOfAccounts||[]).find(x=>x.code===code);
  const inp=el('vc-acct-'+i); if(inp&&a) inp.value=a.code+' — '+a.name;
  const drop=el('vc-acctdrop-'+i); if(drop) drop.style.display='none';
}

  if(!id) return;
  const t=(CACHE.voucherTemplates||[]).find(x=>x.id===+id);
  if(!t) return;
  voucherLines=t.lines.map(l=>({target_type:l.person_id?'person':'account',code:l.code||'',person_id:l.person_id||'',debit:l.debit||0,credit:l.credit||0,description:l.description||''}));
  if(t.description) el('vc-desc').value=t.description;
  if(t.cost_center_id && el('vc-cc')) el('vc-cc').value=t.cost_center_id;
  renderVoucherLines();
}
function renderVoucherLines(){
  el('vcLines').innerHTML = voucherLines.map((l,i)=>`
    <div class="form-grid" style="margin-bottom:6px">
      <div class="fg"><label>نوع طرف حساب</label><select onchange="voucherLines[${i}].target_type=this.value;renderVoucherLines()">
        <option value="account" ${l.target_type!=='person'?'selected':''}>حساب (کدینگ)</option>
        <option value="person" ${l.target_type==='person'?'selected':''}>شخص</option>
      </select></div>
      <div class="fg">${l.target_type==='person'
        ?`<label>شخص</label><select onchange="voucherLines[${i}].person_id=+this.value">${personOptions(l.person_id)}</select>`
        :`<label>حساب</label>${acctSearchHtml(i,l.code)}`}</div>
      <div class="fg"><label>بدهکار</label><input type="text" inputmode="numeric" class="money" value="${moneyInit(l.debit)}" oninput="voucherLines[${i}].debit=(+this.value.replace(/[^\d]/g,''))||0;voucherLines[${i}].credit=0;updateVoucherBalance()"></div>
      <div class="fg"><label>بستانکار</label><input type="text" inputmode="numeric" class="money" value="${moneyInit(l.credit)}" oninput="voucherLines[${i}].credit=(+this.value.replace(/[^\d]/g,''))||0;voucherLines[${i}].debit=0;updateVoucherBalance()"></div>
      <div class="fg"><label>شرح ردیف</label><div style="display:flex;gap:6px">
        <input value="${esc(l.description||'')}" oninput="voucherLines[${i}].description=this.value" style="flex:1">
        ${voucherLines.length>2?`<button class="btn sm red icon" onclick="removeVoucherLine(${i})">🗑️</button>`:''}
      </div></div>
    </div>`).join('');
  updateVoucherBalance();
}
function addVoucherLine(){ voucherLines.push({target_type:'account',code:'',person_id:'',debit:0,credit:0,description:''}); renderVoucherLines(); }
function removeVoucherLine(i){ voucherLines.splice(i,1); renderVoucherLines(); }
function updateVoucherBalance(){
  const totD=voucherLines.reduce((a,l)=>a+(l.debit||0),0);
  const totC=voucherLines.reduce((a,l)=>a+(l.credit||0),0);
  const bal=el('vcBalance'); if(!bal) return;
  const balanced=Math.abs(totD-totC)<0.01;
  bal.innerHTML=`بدهکار: ${fmt(totD)} ت &nbsp;|&nbsp; بستانکار: ${fmt(totC)} ت &nbsp;—&nbsp;
    <span style="color:${balanced?'var(--green)':'var(--red)'}">${balanced?'✓ متوازن':'✗ نامتوازن — سند قابل ثبت نیست'}</span>`;
}
function buildVoucherLinesPayload(){
  return voucherLines
    .filter(l=>(l.target_type==='person'?l.person_id:l.code)&&(l.debit||l.credit))
    .map(l=>l.target_type==='person'
      ?{person_id:l.person_id,debit:l.debit,credit:l.credit,description:l.description}
      :{code:l.code,debit:l.debit,credit:l.credit,description:l.description});
}
async function saveVoucher(){
  const desc=el('vc-desc').value.trim();
  if(!desc){ showToast('شرح سند الزامی است','error'); return; }
  const totD=voucherLines.reduce((a,l)=>a+(l.debit||0),0);
  const totC=voucherLines.reduce((a,l)=>a+(l.credit||0),0);
  if(Math.abs(totD-totC)>0.01){ showToast('سند نامتوازن است — بدهکار باید با بستانکار برابر باشد','error'); return; }
  const lines=buildVoucherLinesPayload();
  if(lines.length<2){ showToast('حداقل دو ردیف معتبر لازم است','error'); return; }
  try{
    await api('POST','/accounting/vouchers',{date:el('vc-date').value,description:desc,cost_center_id:+el('vc-cc')?.value||null,lines});
    closeModal(); showToast('سند ثبت شد'); loadAccTab('vouchers');
  }catch(e){}
}

async function uploadVoucherAttachment(id){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*,.pdf';
  inp.onchange=async()=>{
    if(!inp.files[0]) return;
    const fd=new FormData(); fd.append('file',inp.files[0]);
    try{
      const token=localStorage.getItem('crm_token');
      const res=await fetch('/api/accounting/vouchers/'+id+'/attachment',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});
      if(!res.ok) throw new Error();
      showToast('پیوست اضافه شد'); loadAccTab('vouchers');
    }catch(e){ showToast('خطا در آپلود پیوست','error'); }

async function pettyCashExpenseModal(boxId,boxName){
  if(!CACHE.banks) CACHE.banks=await api('GET','/banks')||[];
  if(!CACHE.checkCategories) CACHE.checkCategories=await api('GET','/check-categories')||[];
  expensePaymentModal();
  // Lock the payment type/cash-box to this fund and clear/disable the bank
  // select — a petty cash expense is always a cash payment from this specific
  // fund (resolveCashAccount would otherwise prefer a selected bank over the
  // cash box).
  setTimeout(()=>{
    const pt=el('ex-paytype'); if(pt){ pt.value='cash'; pt.disabled=true; }
    const bank=el('ex-bank'); if(bank){ bank.value=''; bank.disabled=true; }
    const cb=el('ex-cashbox'); if(cb){ cb.value=boxId; cb.disabled=true; }
    const head=document.querySelector('#modalRoot .modal-head h3'); if(head) head.textContent='🧾 ثبت هزینه از تنخواه: '+boxName;
  },50);
}
function pettyCashReplenishModal(boxId,boxName){
  transferModal();
  setTimeout(()=>{
    el('tr-to-type').value='cash'; updateTransferSideOptions('to');
    el('tr-to-id').value=boxId;
    const fromType=el('tr-from-type'); if(fromType) fromType.value='bank';
    updateTransferSideOptions('from');
    const head=document.querySelector('#modalRoot .modal-head h3'); if(head) head.textContent='➕ افزایش تنخواه: '+boxName;
  },50);
}

// Open an authenticated HTML page (e.g. printable PDF) in a new tab
async function openHtmlAuth(url){
  const token=localStorage.getItem('crm_token');
  try{
    const r=await fetch(url,{headers:{'Authorization':'Bearer '+token}});
    if(!r.ok){ showToast('خطا در دریافت','error'); return; }
    let html=await r.text();
    // about:blank has no base URL — anchor relative paths (logo, fonts) to the app origin
    html=html.replace(/<head>/i,'<head><base href="'+location.origin+'/">');
    const w=window.open('','_blank'); w.document.write(html); w.document.close();
  }catch(e){ showToast('خطا','error'); }
}

async function saveSettlement(){
  const cust_id=+el('st-cust').value, amount=moneyVal('st-amount');

  if(!cust_id||!amount){ showToast('مشتری و مبلغ الزامی است','error'); return; }
  if(pay_type==='cheque'){
    const bank=el('st-cbank')?.value?.trim(), sayadi=el('st-csayadi')?.value?.trim(), due=el('st-cdue')?.value?.trim();
    if(!bank||!sayadi||!due){ showToast('برای پرداخت چک، نام بانک، شماره صیادی و سررسید الزامی است','error'); return; }
  }
  try{
    await api('POST','/accounting/settlements',{
      cust_id, amount, pay_type,
      date:el('st-date').value,
      note:el('st-note').value,
      bank_id:+el('st-bank').value||null,

      cheque_number:pay_type==='cheque'?(el('st-cnum')?.value||''):'',
      cheque_account:pay_type==='cheque'?(el('st-caccnum')?.value||''):'',
      cheque_amount:pay_type==='cheque'?(moneyVal('st-camount')||amount):0,
      cheque_owner:pay_type==='cheque'?(el('st-cowner')?.value||''):'',
      cheque_due:pay_type==='cheque'?(el('st-cdue')?.value||''):'',
