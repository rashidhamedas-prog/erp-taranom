let msgTab='inbox', MSGS=[], msgSearch='';
ROUTES.messages = async function(){
  el('view').innerHTML='<div class="muted">در حال بارگذاری...</div>';
  MSGS=await api('GET','/messages')||[];
  const inbox = MSGS.filter(m=>m.direction==='received');
  const sent = MSGS.filter(m=>m.direction==='sent');
  const unread = inbox.filter(m=>!m.is_read).length;
  el('view').innerHTML=`
    <div class="msg-tabs" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <button id="tabInbox" class="btn${msgTab==='inbox'?' green':' ghost'}" onclick="switchMsgTab('inbox')">
        📥 دریافتی ${unread>0?`<span style="background:#dc2626;color:#fff;border-radius:12px;padding:1px 7px;font-size:11px;margin-right:4px">${unread}</span>`:''}
      </button>
      <button id="tabSent" class="btn${msgTab==='sent'?' green':' ghost'}" onclick="switchMsgTab('sent')">📤 ارسالی (${sent.length})</button>
      <input id="msgSearchInput" class="search" placeholder="جستجو در پیام‌ها..." value="${esc(msgSearch)}" style="flex:1;min-width:140px" oninput="msgSearch=this.value;renderMsgs()">
      <button class="btn ghost" onclick="markAllRead()">✔️ خواندن همه</button>
      <button class="btn" onclick="composeMsg()">✉️ پیام جدید</button>
    </div>
    <div id="msgList"></div>`;
  renderMsgs();
  setTimeout(async()=>{ await api('POST','/messages/read-all'); refreshMsgBadge(); }, 800);
};
function switchMsgTab(t){
  msgTab=t;
  const ib=el('tabInbox'), sn=el('tabSent');
  if(ib){ ib.className=t==='inbox'?'btn green':'btn ghost'; }
  if(sn){ sn.className=t==='sent'?'btn green':'btn ghost'; }
  renderMsgs();
}
function renderMsgs(){
  let list = MSGS.filter(m=> msgTab==='inbox' ? m.direction==='received' : m.direction==='sent');
  if(msgSearch){ const q=msgSearch.toLowerCase(); list=list.filter(m=>(m.body||'').toLowerCase().includes(q)||(m.from_name||'').toLowerCase().includes(q)||(m.to_name||'').toLowerCase().includes(q)); }
  const canDelete = ME.role==='admin';
  el('msgList').innerHTML = list.map(m=>`
    <div class="msg ${(msgTab==='inbox'&&!m.is_read)?'unread':''}" style="border-radius:10px;margin-bottom:8px;border:1.5px solid ${(msgTab==='inbox'&&!m.is_read)?'var(--purple)':'var(--border)'}">
      <div class="mh" style="display:flex;justify-content:space-between;align-items:center">
        <span style="display:flex;align-items:center;gap:8px">
          <span style="width:34px;height:34px;border-radius:50%;background:var(--purple-light);color:var(--purple);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700">
            ${(msgTab==='inbox'?(m.from_name||'?'):(m.to_name||'؟'))[0]}
          </span>
          <span>
            <div style="font-weight:600;font-size:13px">${msgTab==='inbox'?'از: '+esc(m.from_name||'سیستم'):'به: '+esc(m.to_name||'📢 همه')}</div>
            <div style="font-size:11px;color:var(--muted)">${new Date(m.created_at*1000).toLocaleString('fa-IR',{dateStyle:'short',timeStyle:'short'})}</div>
          </span>
        </span>
        <span style="display:flex;gap:6px;align-items:center">
          ${(msgTab==='inbox'&&!m.is_read)?'<span style="width:8px;height:8px;border-radius:50%;background:var(--purple);display:inline-block"></span>':''}
          <button class="btn sm ghost" title="پاسخ" onclick="replyMsg(${m.id},'${esc(m.from_name||'')}',${m.from_id||0})">↩️</button>
          ${(canDelete||m.from_id===ME.id)?`<button class="btn sm red" onclick="deleteMsg(${m.id})">🗑️</button>`:''}
        </span>
      </div>
      <div class="mb" style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border);white-space:pre-wrap;font-size:13px">${esc(m.body)}</div>
      ${m.image?`<div style="margin-top:8px"><a href="/uploads/messages/${esc(m.image)}" target="_blank"><img src="/uploads/messages/${esc(m.image)}" style="max-width:100%;border-radius:8px;border:1px solid var(--border);cursor:zoom-in"></a></div>`:''}
    </div>`).join('') || '<div class="empty" style="padding:40px;text-align:center">📭 پیامی یافت نشد</div>';
}
async function markVisibleRead(){ setTimeout(async()=>{ await api('POST','/messages/read-all'); refreshMsgBadge(); }, 800); }
async function markAllRead(){ await api('POST','/messages/read-all'); MSGS=await api('GET','/messages'); renderMsgs(); refreshMsgBadge(); showToast('همه خوانده شد'); }
async function deleteMsg(id){
  if(!confirm('این پیام حذف شود؟')) return;
  await api('DELETE','/messages/'+id);
  MSGS=MSGS.filter(m=>m.id!==id); renderMsgs(); showToast('پیام حذف شد');
}
async function composeMsg(toId, toName){
  let recipients;
  try{ recipients=await api('GET','/messages/users')||[]; }catch(e){ recipients=[]; }
  const opts = recipients.map(u=>`<option value="${u.id}" ${(toId&&toId===u.id)?'selected':''}>${esc(u.name)}</option>`).join('');
  const broadcastOpt = ME.role==='admin' ? '<option value="">📢 همه کاربران</option>' : '';
  openModal(`
    <div class="modal-head"><h3>✉️ پیام جدید</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body"><div class="form-grid">
      <div class="fg full"><label>گیرنده</label><select id="m-to">${broadcastOpt}${opts}</select></div>
      <div class="fg full"><label>متن پیام</label><textarea id="m-body" style="min-height:110px" placeholder="متن پیام خود را اینجا بنویسید..."></textarea></div>
    </div></div>
    <div class="modal-foot"><button class="btn green" onclick="sendMsg()">📤 ارسال پیام</button>
      <button class="btn ghost" onclick="closeModal()">انصراف</button></div>`);
  if(toName && !toId){ /* broadcast default */ }
}
function replyMsg(id, fromName, fromId){
  if(!fromId || fromId===ME.id) return;
  composeMsg(fromId, fromName);
}
async function sendMsg(){
  const toVal = el('m-to').value;
  const to_id = toVal ? +toVal : null;
  const body = el('m-body').value.trim();
  if(!body){ showToast('متن پیام الزامی است','error'); return; }
  try{
    await api('POST','/messages',{to_id,body});
    closeModal(); MSGS=await api('GET','/messages'); renderMsgs(); showToast('پیام ارسال شد');
  }catch(e){}
}
async function refreshMsgBadge(){
  try{
    const r=await api('GET','/messages/unread-count');
    const b=el('msgBadge'); if(!b)return;
    if(r.count>0){ b.textContent=fmt(r.count); b.classList.remove('hide'); }
    else b.classList.add('hide');
  }catch(e){}
}

  el('remSearch').addEventListener('input',e=>{remFilter.q=e.target.value;renderRemList();});
  el('remDone').addEventListener('change',e=>{remFilter.done=e.target.value;renderRemList();});
  renderRemList();
};
function renderRemList(){
  const body=el('remList'); if(!body) return;
  let rows=(CACHE.reminders||[]).slice();
  if(remFilter.q){ const q=remFilter.q.toLowerCase(); rows=rows.filter(r=>(r.title+' '+(r.body||'')+' '+(r.cust_biz||'')).toLowerCase().includes(q)); }
  if(remFilter.done==='0') rows=rows.filter(r=>!r.done);
  else if(remFilter.done==='1') rows=rows.filter(r=>r.done);
  const today=todayJalali();
  body.innerHTML=rows.length?rows.map(r=>{
    const overdue=!r.done && r.remind_at && r.remind_at<today;
    const isAdmin=ME.role==='admin';
    return `<div class="msg ${overdue?'unread':''}" style="${r.done?'opacity:.55':''}">
      <div class="mh">
        <span>${overdue?'🔴':'🔔'} <b>${esc(r.title)}</b>${r.cust_biz?' — '+esc(r.cust_biz):''}</span>
        <span style="display:flex;gap:6px;align-items:center">
          <span class="mono">${escDate(r.remind_at)}</span>
          ${isAdmin&&r.user_name?`<span class="muted">${esc(r.user_name)}</span>`:''}
          ${!r.done?`<button class="btn sm green" onclick="remDone(${r.id})">✔ انجام شد</button>`:'<span class="tag" style="background:#d1fae5;color:#065f46">✔ انجام</span>'}
          <button class="btn sm ghost" onclick="remModal(${r.id})">✏️</button>
          <button class="btn sm red" onclick="remDelete(${r.id})">🗑️</button>
        </span>
      </div>
      ${r.body?`<div class="mb">${esc(r.body)}</div>`:''}
    </div>`;
  }).join(''):'<div class="empty">یادآوری وجود ندارد</div>';
}
function remModal(id){
  const r=id?(CACHE.reminders||[]).find(x=>x.id===id)||{}:{};
  openModal(`
    <div class="modal-head"><h3>${id?'ویرایش یادآور':'یادآور جدید'}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body"><div class="form-grid">
      <div class="fg full"><label>عنوان *</label><input id="rem-title" value="${esc(r.title||'')}"></div>
      <div class="fg"><label>مشتری مرتبط</label>${custSelect('rem-cust', r.cust_id, true)}</div>
      <div class="fg"><label>تاریخ یادآوری *</label><input id="rem-date" data-jdate value="${esc(r.remind_at||'')}"></div>
      <div class="fg full"><label>توضیحات</label><textarea id="rem-body">${esc(r.body||'')}</textarea></div>
    </div></div>
    <div class="modal-foot">
      <button class="btn" onclick="saveRem(${id||'null'})">💾 ذخیره</button>
      <button class="btn ghost" onclick="closeModal()">انصراف</button>
    </div>`);
  attachDatepickers(el('modalRoot'));
}
async function saveRem(id){
  const title=el('rem-title').value.trim();
  if(!title){showToast('عنوان الزامی است','error');return;}
  const data={title,body:el('rem-body').value,remind_at:el('rem-date').value,cust_id:el('rem-cust').value||null};
  try{
    if(id) await api('PUT','/reminders/'+id,data); else await api('POST','/reminders',data);
    CACHE.reminders=await api('GET','/reminders')||[];
    closeModal(); renderRemList(); showToast('ذخیره شد'); refreshRemBadge();
  }catch(e){showToast('خطا','error');}
}
async function remDone(id){
  await api('PATCH','/reminders/'+id+'/done',{});
  CACHE.reminders=await api('GET','/reminders')||[];
  renderRemList(); refreshRemBadge(); showToast('یادآور انجام شد');
}
async function remDelete(id){
  if(!confirm('این یادآور حذف شود؟')) return;
  await api('DELETE','/reminders/'+id);
  CACHE.reminders=(CACHE.reminders||[]).filter(r=>r.id!==id);
  renderRemList(); refreshRemBadge(); showToast('حذف شد');
}

async function downloadBackup(){
  const st=el('bk-status'); if(st) st.textContent='در حال ساخت پشتیبان...';
  try {
    const token=localStorage.getItem('crm_token');
    const res=await fetch('/api/admin/backup-download',{headers:{'Authorization':'Bearer '+token}});
    if(!res.ok){
      let msg='خطا';
      try{ const j=await res.json(); msg=j.error||msg; }catch{}
      if(st) st.textContent='❌ '+msg; return;
    }
    if(st) st.textContent='در حال دانلود...';
    const blob=await res.blob();
    if(window.showSaveFilePicker){
      try{
        const fh=await window.showSaveFilePicker({
          suggestedName:'crm-latest.tar.gz',
          types:[{description:'فایل پشتیبان',accept:{'application/gzip':['.tar.gz','.gz']}}]
        });
        const w=await fh.createWritable(); await w.write(blob); await w.close();
        if(st) st.textContent='✅ فایل پشتیبان ذخیره شد';
        return;
      }catch(e){ if(e.name==='AbortError'){ if(st) st.textContent=''; return; } }
    }
    // fallback for browsers that don't support showSaveFilePicker
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='crm-latest.tar.gz'; a.click();
    URL.revokeObjectURL(url);
    if(st) st.textContent='✅ دانلود شروع شد';
  }catch(e){ if(st) st.textContent='❌ '+e.message; }
}

============================================================ */
function confirmDelete(entity, id, label){
  openModal(`
    <div class="modal-head"><h3>تأیید حذف</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body"><p>آیا از حذف <b>${esc(label)}</b> مطمئن هستید؟ این عمل قابل بازگشت نیست.</p></div>
    <div class="modal-foot"><button class="btn red" onclick="doDelete('${entity}',${id})">🗑️ حذف</button>
      <button class="btn ghost" onclick="closeModal()">انصراف</button></div>`);
}
async function doDelete(entity,id){
  await api('DELETE','/'+entity+'/'+id);
  closeModal(); showToast('حذف شد');
  // refresh whatever is open
  if(entity==='customers'){ await reloadCustomers(); if(CURRENT_PAGE==='customers')renderCustTable(); }
  else if(entity==='followups'){ CACHE.followups=await api('GET','/followups'); renderFupView(); }
  else if(entity==='invoices'){ CACHE.invoices=await api('GET','/invoices'); renderInvTable(); }
  else if(entity==='products'){ await loadProductsFiltered(); renderProdGrid(true); }
  else if(entity==='admin/users'){ CACHE.users=await api('GET','/auth/users'); ROUTES.users(); }
}
function openChangePass(){
  openModal(`
    <div class="modal-head"><h3>تغییر رمز عبور</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body"><div class="form-grid">
      <div class="fg full"><label>رمز فعلی</label><input id="cp-old" type="password"></div>
      <div class="fg full"><label>رمز جدید</label><input id="cp-new" type="password"></div>
    </div></div>
    <div class="modal-foot"><button class="btn" onclick="doChangePass()">💾 تغییر</button>
      <button class="btn ghost" onclick="closeModal()">انصراف</button></div>`);
}
async function doChangePass(){
  const oldPass=el('cp-old').value, newPass=el('cp-new').value;
  if(!newPass){ showToast('رمز جدید الزامی است','error'); return; }
  await api('POST','/auth/change-password',{oldPass,newPass});
  closeModal(); showToast('رمز تغییر کرد');
}

function showImgPreview(src){
  const ov = document.createElement('div');
  ov.className = 'img-overlay';
  ov.innerHTML = `<img src="${src}">`;
  ov.onclick = ()=>ov.remove();
  document.body.appendChild(ov);
}

============================================================ */
let _pwaPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _pwaPrompt = e;
  if(!localStorage.getItem('pwa_dismissed')) el('installBanner').classList.add('show');
});
function doPWAInstall(){
  if(!_pwaPrompt) return;
  _pwaPrompt.prompt();
  _pwaPrompt.userChoice.then(r=>{ if(r.outcome==='accepted') dismissInstall(); });
}
function dismissInstall(){ el('installBanner').classList.remove('show'); localStorage.setItem('pwa_dismissed','1'); }

/* ============================================================
   CLOCK + SW + INIT
============================================================ */
setInterval(()=>{
  const c=el('clock');
  if(c) c.textContent=_serverNow().toLocaleTimeString('fa-IR',{timeZone:'Asia/Tehran',hour:'2-digit',minute:'2-digit'});
}, 1000);

window.addEventListener('resize', ()=>{ clearTimeout(window._rsz); window._rsz=setTimeout(fitStatNums,120); });
window.addEventListener('DOMContentLoaded', async ()=>{
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('/sw.js'); }catch(e){} }
  // Sync server time first (no auth needed) so all date defaults are accurate
  await syncServerTime();
  const token = localStorage.getItem('crm_token');
  if(token){
    try{ ME = JSON.parse(localStorage.getItem('crm_user')); await boot(); }
    catch(e){ logout(); }
  }
});
</script>
</body>
