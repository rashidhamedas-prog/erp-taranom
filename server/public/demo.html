<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<script src="/csp-runtime.js?v=157"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ERP ترنم</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1A5C38">
<link rel="apple-touch-icon" href="/logo.png">
<link href="/vendor/vazirmatn/vazirmatn.css" rel="stylesheet">
<link rel="stylesheet" href="/prod-ui.css?v=157">
<link rel="stylesheet" href="/app.css?v=157">
<link rel="stylesheet" href="/demo.css?v=4">
<script src="/vendor/chart.umd.js" defer></script>
</head>
<body>

<div class="demo-watermark" role="status">نسخه نمایشی — داده‌ها کاملاً ساختگی هستند · ساخته‌شده توسط شرکت ترانه اندیشه پردازان ریان</div>

<!-- ===== LOGIN — همان کارت ورود برنامه ===== -->
<div id="login">
  <button type="button" class="theme-toggle-btn" id="loginThemeBtn">🌙 حالت تاریک</button>
  <div class="login-card">
    <div class="logo"><img src="/logo-sm.png" alt="ترنم"><span>🌿</span></div>
    <h1>ERP ترنم</h1>
    <p>سامانه یکپارچه ERP پوشاک ترنم</p>
    <form id="loginForm">
      <div class="field">
        <label>نام کاربری</label>
        <input id="loginUser" autocomplete="username" placeholder="admin">
      </div>
      <div class="field">
        <label>رمز عبور</label>
        <input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit">ورود به سامانه</button>
      <div class="login-err" id="loginErr"></div>
    </form>
    <div class="login-hint">نسخه نمایشی · داده‌ها کاملاً ساختگی هستند<br>ساخته‌شده توسط <b>شرکت ترانه اندیشه پردازان ریان</b></div>
  </div>
</div>

<!-- ===== APP — همان شل سایدبار + نوار بالا ===== -->
<div id="app">
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="/logo-sm.png" alt="ترنم"><span class="emoji">🌿</span>
        <div><h2>ERP ترنم</h2><small id="brandRole">پنل مدیریت</small></div>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="left">
          <button type="button" class="menu-btn" id="menuBtn">☰</button>
          <button type="button" class="back-btn" id="navBackBtn" title="بالا" aria-label="بالا">↑</button>
          <h3 id="pageTitle">داشبورد</h3>
        </div>
        <div class="right">
          <button type="button" class="notif-bell" id="notifBell" title="اعلان‌ها">🔔<span class="nbadge" id="notifBadge">7</span></button>
          <span class="clock" id="clock"></span>
          <div class="user">
            <div class="avatar" id="avatar">م</div>
            <div><div id="userName">مدیر سیستم</div><div class="muted" id="userRole">مدیر</div></div>
          </div>
        </div>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>

  <button type="button" id="acctFab" class="acct-fab" title="حساب کاربری" aria-label="منوی حساب کاربری" aria-expanded="false" aria-controls="acctDrawer">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg>
  </button>
  <div id="acctDrawerBackdrop" aria-hidden="true"></div>
  <div id="acctDrawer" role="dialog" aria-label="منوی حساب کاربری">
    <div class="acct-drawer-user">
      <b id="acctDrawerName">مدیر سیستم</b>
      <span id="acctDrawerUser">admin</span>
    </div>
    <button type="button" class="acct-drawer-btn" id="acctThemeBtn">🌙 حالت تاریک</button>
    <button type="button" class="acct-drawer-btn danger" id="acctBtnOut">🚪 خروج</button>
  </div>
</div>

<div id="modalRoot"></div>
<div id="sidebarBackdrop"></div>
<div id="toasts"></div>

<script src="/demo.js?v=4"></script>
</body>
</html>
