plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.taranom.crm'
    compileSdk 36

    defaultConfig {
        applicationId "ir.taranom.crm"
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName "2.0.6"

        ndk {
            // ABIs shipped by nodejs-mobile
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            storeFile file('../crm-taranom.jks')
            storePassword 'CrmTaranom2024!'
            keyAlias 'crm-taranom'
            keyPassword 'CrmTaranom2024!'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // libnode.so per ABI, laid out by the layoutNodeLibs task below
            jniLibs.srcDirs += ['libnode/bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

// ---------------------------------------------------------------------------
// nodejs-mobile integration.
// 1) Download the nodejs-mobile-android AAR (see BUILD.md) into app/libs/ as
//    nodejs-mobile.aar. extractNodeLibs/layoutNodeLibs unpack libnode.so and
//    the node headers into app/libnode/ for CMake and packaging.
// 2) copyServerSources refreshes the bundled backend from ../../server into
//    src/main/assets/nodejs-project/server before every build, so the APK
//    always ships the current code. node_modules for the nodejs-project is
//    produced once per nodejs-mobile version (see BUILD.md — better-sqlite3
//    is cross-compiled with the Android NDK).
// ---------------------------------------------------------------------------
tasks.register('extractNodeLibs', Copy) {
    def aar = file('libs/nodejs-mobile.aar')
    onlyIf { aar.exists() }
    from zipTree(aar)
    into file('libnode-aar')
}

tasks.register('layoutNodeLibs', Copy) {
    dependsOn 'extractNodeLibs'
    onlyIf { file('libnode-aar').exists() }
    from(file('libnode-aar/jni')) { into 'bin' }
    from(file('libnode-aar/include')) { into 'include' }
    into file('libnode')
}

tasks.register('copyServerSources', Copy) {
    doFirst { delete file('src/main/assets/nodejs-project/server') }
    from(file('../../server')) {
        exclude 'node_modules/**', 'backups/**', '*.db', '*.db-wal', '*.db-shm', '.env',
                'public/uploads/**',
                'public/releases/*.exe', 'public/releases/*.blockmap', 'public/releases/latest.yml'
    }
    into file('src/main/assets/nodejs-project/server')
}

preBuild.dependsOn 'layoutNodeLibs'
preBuild.dependsOn 'copyServerSources'

dependencies {
    // Plain WebView + embedded Node runtime — no external UI dependencies
}
