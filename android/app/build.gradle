plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.taranom.crm'
    compileSdk 36

    ndkVersion "25.1.8937393"

    defaultConfig {
        applicationId "ir.taranom.crm"
        minSdk 24
        targetSdk 34
        versionCode 27
        versionName "2.0.25"

        ndk {
            // ABIs shipped by nodejs-mobile
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    // اسرار امضا هرگز در گیت نیستند: از android/keystore.properties (در .gitignore)
    // یا متغیرهای محیطی CRM_KEYSTORE_* خوانده می‌شوند — نمونه در BUILD.md
    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file('keystore.properties')
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    def ksFile   = keystoreProps.getProperty('storeFile')   ?: System.getenv('CRM_KEYSTORE_FILE')
    def ksPass   = keystoreProps.getProperty('storePassword') ?: System.getenv('CRM_KEYSTORE_PASSWORD')
    def ksAlias  = keystoreProps.getProperty('keyAlias')    ?: System.getenv('CRM_KEY_ALIAS')
    def ksKeyPass = keystoreProps.getProperty('keyPassword') ?: System.getenv('CRM_KEY_PASSWORD')

    signingConfigs {
        if (ksFile && ksPass && ksAlias && ksKeyPass) {
            release {
                storeFile rootProject.file(ksFile)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile && ksPass && ksAlias && ksKeyPass) {
                signingConfig signingConfigs.release
            } else {
                // No release keystore — debug-sign so APK is installable (sideload).
                // Users upgrading from an older release-signed build must uninstall first.
                signingConfig signingConfigs.debug
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // libnode.so per ABI, laid out by the layoutNodeLibs task below
            jniLibs.srcDirs += ['libnode/bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    // nodejs-mobile: native libs must extract at install time (libnode.so + better_sqlite3)
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    // lint-gradle is sometimes unreachable via aliyun mirrors; do not block APK release.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// ---------------------------------------------------------------------------
// nodejs-mobile integration.
// 1) Download the nodejs-mobile-android AAR (see BUILD.md) into app/libs/ as
//    nodejs-mobile.aar. extractNodeLibs/layoutNodeLibs unpack libnode.so and
//    the node headers into app/libnode/ for CMake and packaging.
// 2) copyServerSources refreshes the bundled backend from ../../server into
//    src/main/assets/nodejs-project/server before every build, so the APK
//    always ships the current code. node_modules for the nodejs-project is
//    produced once per nodejs-mobile version (see BUILD.md — better-sqlite3
//    is cross-compiled with the Android NDK).
// ---------------------------------------------------------------------------
tasks.register('extractNodeLibs', Copy) {
    def aar = file('libs/nodejs-mobile.aar')
    onlyIf { aar.exists() }
    from zipTree(aar)
    into file('libnode-aar')
}

tasks.register('layoutNodeLibs', Copy) {
    dependsOn 'extractNodeLibs'
    onlyIf { file('libnode-aar').exists() }
    from(file('libnode-aar/jni')) { into 'bin' }
    from(file('libnode-aar/include')) { into 'include' }
    into file('libnode')
}

// libnode.so (nodejs-mobile) is linked against the NDK C++ shared STL.
// Without packaging libc++_shared.so, dlopen fails on modern Android:
//   "library \"libc++_shared.so\" not found: needed by .../libnode.so"
tasks.register('copyLibcxxShared') {
    def ndkDir = android.ndkDirectory
    def abiToTriple = [
            'arm64-v8a'  : 'aarch64-linux-android',
            'armeabi-v7a': 'arm-linux-androideabi',
            'x86_64'     : 'x86_64-linux-android',
    ]
    def hostTag = 'windows-x86_64'
    inputs.property('ndkPath', ndkDir.absolutePath)
    outputs.files(abiToTriple.keySet().collect { abi ->
        file("libnode/bin/${abi}/libc++_shared.so")
    })
    doLast {
        def prebuilt = file("${ndkDir}/toolchains/llvm/prebuilt/${hostTag}/sysroot/usr/lib")
        if (!prebuilt.exists()) {
            // Linux/mac CI hosts
            ['linux-x86_64', 'darwin-x86_64', 'darwin-arm64'].each { tag ->
                def cand = file("${ndkDir}/toolchains/llvm/prebuilt/${tag}/sysroot/usr/lib")
                if (cand.exists()) prebuilt = cand
            }
        }
        if (!prebuilt.exists()) {
            throw new GradleException("NDK libc++ sysroot not found under ${ndkDir}")
        }
        abiToTriple.each { abi, triple ->
            def src = file("${prebuilt}/${triple}/libc++_shared.so")
            if (!src.exists()) {
                throw new GradleException("Missing ${src} — install NDK ${android.ndkVersion}")
            }
            def destDir = file("libnode/bin/${abi}")
            destDir.mkdirs()
            copy {
                from src
                into destDir
            }
            logger.lifecycle("copyLibcxxShared: ${abi} <- ${src.name} (${src.length()} bytes)")
        }
    }
}

// Ship better-sqlite3 as a normal JNI .so so Android 15+ pageSizeCompat /
// extractNativeLibs applies. main.js copies it into build/Release/.
tasks.register('copyBetterSqlite3Jni') {
    def abis = ['arm64-v8a', 'armeabi-v7a', 'x86_64']
    def prebuiltRoot = file('src/main/assets/nodejs-project/node_modules/better-sqlite3/prebuilt/android')
    inputs.files(abis.collect { abi -> file("${prebuiltRoot}/${abi}/better_sqlite3.node") })
    outputs.files(abis.collect { abi -> file("libnode/bin/${abi}/libbetter_sqlite3.so") })
    doLast {
        abis.each { abi ->
            def src = file("${prebuiltRoot}/${abi}/better_sqlite3.node")
            if (!src.exists()) {
                throw new GradleException("Missing ${src} — run scripts/build-better-sqlite3-android.ps1")
            }
            def destDir = file("libnode/bin/${abi}")
            destDir.mkdirs()
            def dest = file("${destDir}/libbetter_sqlite3.so")
            java.nio.file.Files.copy(
                    src.toPath(),
                    dest.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
            logger.lifecycle("copyBetterSqlite3Jni: ${abi} (${dest.length()} bytes)")
        }
    }
}

tasks.register('copyServerSources', Copy) {
    doFirst { delete file('src/main/assets/nodejs-project/server') }
    from(file('../../server')) {
        // Keep APK lean and avoid CompressAssets failures (spaces in paths,
        // huge mahak xlsx, test scripts). Runtime never needs these on-device.
        exclude 'node_modules/**', 'backups/**', '*.db', '*.db-wal', '*.db-shm', '.env',
                'public/uploads/**',
                'public/releases/**',
                'uploads/**',
                'scripts/test-*.js',
                'scripts/test-*.mjs',
                'scripts/*mahak*',
                'scripts/import-mahak*',
                'scripts/verify-mahak*',
                'scripts/seed-*.js',
                'lib/mahak-import.js',
                'lib/mahak-import-helpers.js',
                'mahak-*.md',
                '**/*.xlsx',
                '**/*.xls'
    }
    into file('src/main/assets/nodejs-project/server')
}

preBuild.dependsOn 'layoutNodeLibs'
preBuild.dependsOn 'copyLibcxxShared'
preBuild.dependsOn 'copyBetterSqlite3Jni'
preBuild.dependsOn 'copyServerSources'

dependencies {
    // Plain WebView + embedded Node runtime — no external UI dependencies
}
