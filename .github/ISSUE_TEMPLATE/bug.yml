name: گزارش باگ
description: رفتار غلط در محصول، حسابداری، موجودی یا همگام‌سازی
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        باگ امنیتی را اینجا ننویسید — از [Security Advisory](https://github.com/rashidhamedas-prog/erp-taranom/security/advisories/new) استفاده کنید.
  - type: dropdown
    id: surface
    attributes:
      label: سطح اثر
      options:
        - حسابداری / سند / دفتر
        - موجودی / انبار / تولید
        - فاکتور / فروش / تسویه
        - ورود / نقش / شرکت
        - همگام‌سازی آفلاین
        - UI
        - دیپلوی / CI
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: انتظار
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: رفتار فعلی
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: بازتولید
      description: نقش کاربر، شرکت/سال مالی، و مراحل. رمز و دادهٔ واقعی نگذارید.
    validations:
      required: true
  - type: input
    id: sw
    attributes:
      label: نسخه SW / commit
      placeholder: erp-taranom-v213 / 2b38821
