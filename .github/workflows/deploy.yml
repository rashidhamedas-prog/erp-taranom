name: Deploy CRM ترنم

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Git branch to deploy'
        required: false
        default: 'claude/claude-md-docs-2ssrpy'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 2299 }}
          script_stop: true
          script: |
            set -e
            export DEPLOY_BRANCH="${{ github.event.inputs.branch || 'claude/claude-md-docs-2ssrpy' }}"
            export APP_ROOT="${{ secrets.APP_ROOT || '/home/taranom-admin/crm-taranom' }}"
            cd "$APP_ROOT"
            git fetch origin "$DEPLOY_BRANCH"
            git checkout "$DEPLOY_BRANCH"
            git pull origin "$DEPLOY_BRANCH"
            if [ -f "$APP_ROOT/scripts/deploy-production.sh" ]; then
              bash "$APP_ROOT/scripts/deploy-production.sh"
            else
              echo "==> deploy-production.sh not found — inline deploy"
              cd "$APP_ROOT/server"
              JWT_FILE="$APP_ROOT/server/jwt-secret.txt"
              if [ ! -f "$JWT_FILE" ]; then
                node -e "console.log(require('crypto').randomBytes(32).toString('hex'))" > "$JWT_FILE"
                chmod 600 "$JWT_FILE"
              fi
              npm install --omit=dev
              pm2 describe crm-taranom >/dev/null 2>&1 && pm2 restart crm-taranom --update-env || pm2 start ecosystem.config.js
              pm2 save
              sleep 2
              curl -sf "http://127.0.0.1:${PORT:-3000}/api/system/time"
            fi
