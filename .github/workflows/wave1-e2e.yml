name: Wave 1 E2E Money Paths

on:
  push:
    branches: ['ai/W1-*', 'claude/claude-md-docs-2ssrpy']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-money:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
        working-directory: server
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test --config playwright.config.js money-cycle.spec.js critical-paths.spec.js
        working-directory: e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-w1-artifacts
          path: |
            e2e/test-results
            e2e/playwright-report
